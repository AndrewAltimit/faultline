# -- Kill chain: management access to mass terminal bricking ---------------
#
# Five short phases mirroring the public incident analysis. Each
# successful phase emits CoercionPressure (a generic availability-denial
# metric here); the destructive phases damage the management and terminal
# infrastructure. Cumulative pressure crosses the 0.55 denial threshold
# within the first week — the mass bricking — with the recovery phase
# extending the modeled outage. High base success probabilities reflect a
# reachable management plane and a large, uniform terminal fleet.

[kill_chains.satcom_op]
id = "satcom_op"
name = "Management Access to Mass Terminal Bricking"
description = "Aggregate model of the February 2022 attack: access to the ground-side management network, pivot into the modem-management plane, a destructive firmware/config push, mass terminal bricking, and the sustained connectivity outage before reconfiguration/replacement."
attacker = "satcom_disruptor"
target = "satcom_operator"
entry_phase = "mgmt_access"

[kill_chains.satcom_op.phases.mgmt_access]
id = "mgmt_access"
name = "Access to Ground-Side Management Network"
description = "Aggregate model of access to the ground-side network-management environment of the broadband segment. Effect-level only; no payload or technique detail."
