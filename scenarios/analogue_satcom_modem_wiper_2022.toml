# Historical-analogue scenario
# =============================
#
# Single named-event analogue: the late-February 2022 destructive
# cyberattack against the consumer-broadband segment of a satellite
# communications network serving European users. A wiper-style attack
# corrupted the modem firmware/configuration of tens of thousands of
# fixed satellite-broadband terminals, knocking them permanently offline
# and degrading connectivity (including downstream effects on remote
# monitoring of wind turbines) until terminals were reconfigured or
# replaced over the following weeks. The incident was publicly attributed
# by multiple Western governments and is documented in OPEN government
# and defensive-community sources, which makes it a clean single-event
# calibration analogue for a destructive availability attack on a
# satellite-communications availability service (distinct from a grid,
# pipeline, or generic-IT-wiper event).
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("satcom_disruptor"): a destructive intrusion set that gained
#   access to the network-management environment of the broadband
#   segment, then pushed a wiper-style update that corrupted the firmware
#   / configuration of large numbers of consumer modems, bricking them.
#   The disruption was timed to the opening of a conflict to deny
#   communications.
# Defender ("satcom_operator"): the operator of the satellite-broadband
#   segment whose ground-side management environment was reachable and
#   whose terminal fleet was rendered inoperable, requiring mass
#   reconfiguration / replacement to restore service.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# exploit detail, no malware internals, no implementation specifics)
# ---------------------------------------------------------------------
# - Kill-chain shape (access to the ground-side management network ->
#   pivot into the modem-management plane -> push of a destructive
#   firmware/config wiper -> mass terminal bricking -> sustained
#   connectivity outage before reconfiguration/replacement) is drawn
#   from public government attribution statements and defensive-community
#   incident analyses. Only the AGGREGATE phase structure and public
#   outcome are encoded — no exploit or malware internals.
# - Outcome: a successful destructive availability attack. Tens of
#   thousands of terminals were knocked offline; connectivity was lost
#   across multiple European countries; recovery took weeks. Encoded as
#   high phase-success probabilities and an attacker win on the
#   availability-denial metric.
# - Duration: the bulk outage and recovery unfolded over weeks, here
#   modeled at one tick = one day over a multi-week horizon.
#
# All figures (tens of thousands of bricked terminals, multi-country
# connectivity loss, weeks-long recovery, kill-chain stages) are from
# public reporting and contain no classified, CUI, or export-controlled
# material.

[meta]
schema_version = 1
name = "Analogue — Satellite-Broadband Modem Wiper (Feb 2022)"
description = """
Single-event historical analogue: the late-February 2022 destructive
cyberattack against the consumer-broadband segment of a satellite
communications network serving European users. A wiper-style attack
corrupted the firmware/configuration of tens of thousands of fixed
satellite-broadband terminals, knocking them permanently offline and
degrading connectivity across multiple European countries until
terminals were reconfigured or replaced over the following weeks. The
documented availability-denial outcome and multi-week recovery duration
are encoded as calibration observations and back-tested against the
Monte Carlo distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public government attribution statements and
defensive-community incident analyses. No exploit detail, malware
internals, classified, CUI, or export-controlled material is encoded —
only the aggregate statistical effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "wiper", "satcom", "availability", "infrastructure"]
confidence = "High"
scenario_type = "reference"
analytical_purpose = "Does the engine reproduce the documented availability-denial outcome and multi-week recovery duration of the February 2022 satellite-broadband modem wiper attack?"
red_team_profile = "Destructive intrusion set that accessed the ground-side network-management environment of a satellite-broadband segment and pushed a wiper-style update corrupting the firmware/configuration of large numbers of consumer modems, bricking them at the opening of a conflict to deny communications."
blue_team_posture = "Operator of a satellite-broadband segment whose ground-side management environment was reachable and whose terminal fleet was rendered inoperable, requiring mass reconfiguration/replacement to restore service over weeks."
osint_sources = [
    "Public government attribution statements on the February 2022 satellite-broadband attack",
    "Defensive-community incident analyses of the satellite-modem wiper event",
    "Congressional Research Service reporting on cyber threats to space / satellite systems",
    "Published open reporting on the multi-country connectivity loss and recovery timeline",
]
sensitivity_parameters = [
    "kill-chain phase success probabilities (management-network access -> modem-plane pivot -> destructive firmware/config push -> mass terminal bricking)",
    "connectivity-recovery phase duration",
]

[meta.historical_analogue]
name = "February 2022 satellite-broadband modem wiper attack"
