# Maritime Strait Crisis — Flagship Scenario
# ==========================================
#
# A coercion crisis in a contested maritime strait. A regional power
# applies graduated non-kinetic pressure against a transit state that
# depends on the strait for energy imports and seaborne trade. The
# pressure campaign converges three vectors:
#
#   1. Port / terminal SCADA exposure (cargo-handling and pipeline
#      control disruption at the strait's chokepoint terminals).
#   2. GNSS / navigation degradation in the strait approaches
#      (modeled as a comms / coordination disruption effect).
#   3. An economic-coercion accumulator (insurance and shipping-rate
#      shock as transit risk rises) that drives the decisive outcome.
#
# Analytical purpose: quantify how far a non-kinetic coercion campaign
# against a strait-dependent transit state can drive accumulated
# coercion pressure before the transit state's resilience posture
# (port-continuity controls, OT monitoring, route diversification)
# fails, WITHOUT a kinetic conquest.
#
# Modeling approach: the decisive outcome is driven by a multi-phase
# KILL CHAIN accumulating CoercionPressure past a NonKineticThreshold
# victory condition — the reliable path to a decisive verdict in this
# engine. The healthcare / critical-infrastructure SCADA cards are
# reused for the port-control disruption vector.
#
# OSINT provenance (aggregate statistical effects only — no targeting,
# exploit, or implementation detail):
#   - GAO / CRS reporting on maritime / port cybersecurity and
#     OT exposure.
#   - IISS / RAND open analyses of strait-chokepoint vulnerability and
#     coercive maritime pressure.
#   - Open analyses of GNSS interference incidents in maritime
#     approaches.
#   - Published economic analyses of shipping-insurance and freight-rate
#     response to elevated transit risk.
# No classified, CUI, or export-controlled material is used.

attacker_budget = 1_000_000.0
defender_budget = 120_000_000.0

[meta]
schema_version = 1
name = "Maritime Strait Crisis"
description = """
Coercion crisis in a contested maritime strait. A regional power applies
graduated non-kinetic pressure (port/terminal SCADA disruption, GNSS
degradation, insurance/freight-rate shock) against a transit state that
depends on the strait for energy imports and seaborne trade. Models how
far the coercion campaign can drive accumulated pressure past the transit
state's resilience posture without a kinetic conquest.

Parameters are aggregate statistical effects drawn from public GAO / CRS,
IISS / RAND, and published economic analyses. No targeting, exploit, or
implementation detail is encoded.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["maritime", "strait", "chokepoint", "coercion", "critical-infrastructure", "kill-chain"]
scenario_type = "red_team"
analytical_purpose = "Quantify how far a non-kinetic coercion campaign (port SCADA disruption, GNSS degradation, insurance/freight-rate shock) against a strait-dependent transit state can drive accumulated coercion pressure past the transit state's resilience posture, without a kinetic conquest."
red_team_profile = "Regional power applying graduated maritime coercion: terminal SCADA disruption at chokepoint ports, GNSS / navigation degradation in the approaches, and an economic-coercion accumulator (insurance and freight-rate shock as transit risk rises)."
blue_team_posture = "Strait-dependent transit state defending port-continuity, OT monitoring, and route-diversification posture; energy-import and trade dependence on the strait is the contested vulnerability."
osint_sources = [
    "GAO / CRS reporting on maritime / port cybersecurity and OT exposure",
    "IISS / RAND open analyses of strait-chokepoint vulnerability and coercive maritime pressure",
    "Open analyses of GNSS interference incidents in maritime approaches",
    "Published economic analyses of shipping-insurance and freight-rate response to elevated transit risk",
]
sensitivity_parameters = [
    "terminal-SCADA disruption phase success probability",
    "economic-coercion accumulator delta per phase",
    "transit-state route-diversification coverage",
]

