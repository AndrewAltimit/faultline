# Standoff Strike — Force-Projection Reach Wargame
#
# Demonstrates the engine's force-projection phase for the
# `StandoffStrike` reach primitive. Baseline combat only resolves where
# opposing forces physically co-locate; a unit declaring a standoff-strike
# reach can instead remove strength from a hostile force in a region
# *within range* of its own — along region-border adjacency — without
# ever moving into it.
#
# The contract this scenario exercises:
# - A force declaring a standoff-strike reach projects damage into every
#   in-range region each tick. Reach is expressed as an aggregate
#   physical distance and mapped to a region-adjacency hop budget
#   (~150 km per border crossing), so a 300 km reach covers two hops.
# - Each strike removes a fixed strength quantity from a hostile force in
#   the struck region, distributed proportionally across that faction's
#   forces present — the same attrition distribution co-located combat
#   uses — with no return attrition on the firing unit.
# - Strikes honour the same diplomatic coupling as combat: a unit will
#   not strike a faction it is mutually allied with.
#
# Scenario shape: Red holds a rear region (Coastal Approach) with a
# standoff-strike battery whose 300 km reach covers the two forward
# regions where Blue is dug in. Red never advances the battery; its
# effect is felt entirely through projected fires. The report's
# `## Force Projection` section quantifies the resulting attrition.
#
# Parameters are aggregate statistical descriptors derivable from open
# sources (IISS Military Balance entries on long-range fires, CRS reports
# on standoff-strike systems, published range/effect envelopes). The
# scenario describes effects only — a "standoff strike, 300 km reach"
# removing an aggregate strength quantity per engagement window — never
# any specific platform, guidance implementation, or operational tooling.

attacker_budget = 5_000_000.0
defender_budget = 50_000_000.0

[meta]
schema_version = 1
name = "Standoff Strike — Force-Projection Reach Wargame"
description = "A rear-area standoff-strike battery projects fires into two forward regions it never enters. Demonstrates the force-projection phase: a unit with a declared standoff-strike reach removes strength from hostile forces within range (mapped to region-adjacency hops) without moving, honouring the same alliance coupling and attrition distribution as co-located combat. Observe the resulting attrition in the Force Projection section."
author = "AI Agent Bot"
version = "0.1.0"
tags = ["force-projection", "standoff-strike", "reach", "fires"]
confidence = "Medium"

# ============================================================================
# Map — a three-region linear corridor.
#   coastal_approach (Red rear, battery sits here)
#     ── forward_ridge (Blue forward, 1 hop from the battery)
#         ── inland_basin (Blue depth, 2 hops from the battery)
# A 300 km reach (~2 hops) covers both Blue regions; the battery never
# leaves coastal_approach.
# ============================================================================

