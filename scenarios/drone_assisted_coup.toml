max_ticks = 50
monte_carlo_runs = 400
fog_of_war = true
snapshot_interval = 5
seed = 20260321

[simulation.tick_duration]
Days = 1

[simulation.attrition_model]
Stochastic = { noise = 0.15 }

# ============================================================================
# Victory Conditions
# ============================================================================

# Incumbent (coup-proofing) objective: hold the government quarter and
# garrison district for the full horizon — the coup failed to consolidate.
[victory_conditions.regime_held]
id = "regime_held"
name = "Coup Disrupted — Regime Holds"
faction = "incumbent"

[victory_conditions.regime_held.condition]
type = "HoldRegions"
regions = ["government_quarter", "garrison_district"]
duration = 50

# Coup objective: coup momentum (coercion pressure) crosses the tipping
# point — enough institutions defected to flip the outcome.
[victory_conditions.coup_success]
id = "coup_success"
name = "Coup Consolidated"
faction = "coup_faction"

[victory_conditions.coup_success.condition]
type = "NonKineticThreshold"
metric = "CoercionPressure"
threshold = 0.5
