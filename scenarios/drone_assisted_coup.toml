# Drone-Assisted Coup Facilitation — Defensive Planning Wargame
# ==============================================================
#
# Coup-dynamics archetype. A coup faction inside a fragile state attempts
# a coordinated seizure of power, and an uncrewed-systems element augments
# the attempt with ISR (mapping the incumbent's leadership movement and
# loyalist dispositions), communications denial (severing the incumbent's
# ability to rally loyal units), and a decapitation strike against the
# incumbent's leadership cadre. The decisive question is whether the
# drone-enabled tempo lets the coup pass the "tipping point" — the moment
# enough security institutions defect that the outcome flips — before the
# incumbent's loyalists consolidate.
#
# This is framed as a DEFENSIVE-PLANNING wargame for the incumbent
# (coup-proofing): the analytical outputs are the incumbent's detection
# and disruption window against the coup kill chain, the leadership-cadre
# resilience under a decapitation strike, the institutional-defection
# cascade, and the cost-asymmetry between a commodity-drone-enabled coup
# attempt and the counter-coup posture required to blunt it.
#
# Modeling approach: a multi-phase kill chain (leadership ISR -> comms
# denial -> decapitation strike -> defection cascade) accumulates a
# CoercionPressure "coup momentum" metric and drives a LeadershipDecapitation
# output against the incumbent's declared leadership cadre. The incumbent's
# security institutions carry fracture thresholds; a loyalty-erosion event
# can trigger an institution defection once momentum crosses a threshold.
# A high command_resilience on the incumbent models a coup-proofed
# succession; sensitivity on that parameter is the central defensive lever.
#
# OSINT provenance (aggregate statistical effects only — describe effects,
# not implementations; no operational, targeting, or tradecraft detail):
#   - RAND public research on coups, coup-proofing, and civil-military
#     relations; academic political-science literature on coup success
#     factors (the "tipping point" / coordination-cascade model).
#   - CRS and published open analyses of the use of small uncrewed systems
#     in irregular conflict and contested-control environments.
#   - Academic literature on military defection, loyalty, and the role of
#     communications in rallying or fragmenting security forces during
#     coups.
#   - GAO / RAND public research on small-UAS adversary capabilities and
#     C-UAS coordination.
# No classified, CUI, or export-controlled material is used. The factions
# are notional forcing functions for analyzing coup-proofing resilience,
# not representations of any real state, leader, or group. This is a
# defensive-planning wargame, not an operational plan.

attacker_budget = 400_000.0
defender_budget = 80_000_000.0

[meta]
schema_version = 1
name = "Drone-Assisted Coup Facilitation"
description = """
Coup-dynamics wargame. A coup faction in a fragile state attempts a
coordinated seizure of power; an uncrewed-systems element augments it with
leadership ISR, communications denial, and a decapitation strike against
the incumbent's leadership cadre. Models whether the drone-enabled tempo
lets the coup pass the institutional-defection tipping point before the
incumbent's loyalists consolidate. Framed as a coup-proofing (defensive)
wargame for the incumbent: outputs are the disruption window against the
coup kill chain, leadership-cadre resilience under a decapitation strike,
the defection cascade, and the cost-asymmetry of a commodity-drone-enabled
attempt versus the counter-coup posture required to blunt it.

Parameters are aggregate statistical effects from public RAND coup /
coup-proofing research, academic coup-dynamics literature, CRS and open
analyses of small uncrewed systems in irregular conflict, and academic
literature on military defection. No operational, targeting, or tradecraft
detail is encoded. Factions are notional forcing functions, not real states.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["coup", "coup-proofing", "leadership-decapitation", "institutional-defection", "drone", "kill-chain", "defensive-planning"]
confidence = "Medium"
scenario_type = "red_team"
analytical_purpose = "Quantify whether a commodity-drone-enabled coup attempt (leadership ISR, comms denial, a decapitation strike, and a defection cascade) can pass the institutional-defection tipping point before the incumbent's loyalists consolidate, and how the incumbent's leadership-succession resilience (coup-proofing) shifts that outcome."
red_team_profile = "Coup faction inside a fragile state running a coordinated power seizure augmented by an uncrewed-systems element: ISR mapping of leadership movement and loyalist dispositions, communications denial to sever the incumbent's ability to rally loyal units, and a decapitation strike against the incumbent's leadership cadre. Tempo and the defection cascade are the decisive levers. Notional forcing function, not a model of any specific group."
blue_team_posture = "Incumbent government defending against the coup (coup-proofing). Security institutions carry loyalty and fracture thresholds; a leadership cadre with a rehearsed succession (high command_resilience) blunts a decapitation strike's morale shock. Defends with counter-UAS, comms continuity, and loyalty-monitoring controls. The contested vulnerability is the speed of the institutional-defection cascade relative to the loyalist consolidation window."
osint_sources = [
    "RAND public research on coups, coup-proofing, and civil-military relations",
    "Academic political-science literature on coup success factors and the coordination-cascade / tipping-point model",
    "CRS and published open analyses of small uncrewed systems in irregular conflict and contested-control environments",
    "Academic literature on military defection, loyalty, and communications in rallying or fragmenting security forces during coups",
    "GAO / RAND public research on small-UAS adversary capabilities and C-UAS coordination",
]
sensitivity_parameters = [
    "incumbent command_resilience (succession / decapitation-shock attenuation)",
    "decapitation-strike morale_shock and base_success_probability",
    "security-institution fracture_threshold (defection cascade trigger)",
    "comms-denial phase detection_probability_per_tick (counter-UAS / RF coverage)",
]

