# Arctic Sovereignty Standoff — Force-Projection Wargame
# =======================================================
#
# Multi-domain great-power competition over a contested Arctic shipping
# corridor and the sovereignty claims that surround it. As summer sea-ice
# retreat opens a navigable high-latitude route, a revisionist coastal
# power ("Northern Power") asserts expansive control over the corridor's
# chokepoint and approaches, while a status-quo coalition ("Arctic
# Coalition") and a third coastal claimant ("Coastal Claimant") contest
# that assertion.
#
# The decisive military primitive is FORCE PROJECTION via standoff strike:
# a forward-deployed, uncrewed long-range fires / loitering-munition
# element on a Northern Power island outpost projects attrition into the
# adjacent chokepoint and the Coalition's forward picket WITHOUT the
# launching element ever maneuvering into contact. This is the Arctic's
# tyranny-of-distance dynamic rendered as the engine's StandoffStrike
# reach: the side that can hold a corridor at range without moving forces
# forward gains coercive leverage over a transit route that the other
# side cannot economically keep open under sustained fires.
#
# Analytical purpose: quantify how a standoff-fires posture from a single
# fortified Arctic outpost shifts control of a navigable corridor over a
# campaign horizon — and how a Coalition forward picket plus a deep
# garrison either absorbs that attrition or is driven off the chokepoint.
#
# Modeling approach: baseline Lanchester combat resolves only where forces
# co-locate; the Northern Power's projected fires element holds the
# corridor at range. A HoldRegions victory condition for the Coalition
# (keep the chokepoint and approaches for the full horizon) tests whether
# the forward posture survives the projected attrition; a StrategicControl
# condition for the Northern Power tests whether sustained fires plus a
# limited amphibious push flips the corridor. Force-projection attrition is
# surfaced in the report's `## Force Projection` section.
#
# OSINT provenance (aggregate statistical effects only — no platform,
# guidance, or operational detail; describe effects, not implementations):
#   - IISS Military Balance entries on Arctic basing, long-range fires,
#     and uncrewed loitering-munition / standoff-strike reach envelopes.
#   - CRS reporting on Arctic strategy, sea-route opening, and the
#     U.S./allied vs. Russian Arctic force-posture gap.
#   - RAND public research on Arctic security, distance/logistics
#     constraints, and great-power competition in the high north.
#   - Published open analyses of Arctic shipping-corridor economics and
#     icebreaker / escort dependence.
# No classified, CUI, or export-controlled material is used. This is a
# defensive-planning wargame, not an operational plan.

attacker_budget = 8_000_000.0
defender_budget = 90_000_000.0

[meta]
schema_version = 1
name = "Arctic Sovereignty Standoff"
description = """
Multi-domain great-power competition over a navigable Arctic shipping
corridor. A revisionist coastal power asserts control of the corridor
chokepoint using a forward standoff-fires outpost that projects attrition
into the chokepoint and a status-quo coalition's forward picket without
maneuvering forces forward. A coalition forward picket plus deep garrison
contests the claim. Models whether a single fortified Arctic outpost's
projected fires can flip control of a corridor the coalition cannot
economically keep open under sustained attrition.

Parameters are aggregate statistical effects from public IISS Military
Balance, CRS Arctic reporting, RAND Arctic security research, and open
shipping-corridor economic analyses. No platform, guidance, or operational
detail is encoded.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["arctic", "sovereignty", "force-projection", "standoff-strike", "great-power-competition", "shipping-corridor"]
confidence = "Medium"
scenario_type = "red_team"
analytical_purpose = "Quantify how a standoff-fires posture from a single fortified Arctic island outpost shifts control of a navigable shipping corridor over a campaign horizon, and whether a coalition forward picket plus deep garrison absorbs the projected attrition or is driven off the chokepoint."
red_team_profile = "Revisionist Arctic coastal power asserting expansive corridor control. Posture is projected, not maneuvered: a forward island outpost fields an uncrewed long-range fires / loitering-munition element whose reach covers the chokepoint and the coalition forward picket, paired with a limited amphibious option to consolidate the chokepoint once the picket is attrited."
blue_team_posture = "Status-quo Arctic coalition defending freedom of navigation through the corridor with a forward naval picket on the chokepoint and a deep garrison in the home approaches; a third coastal claimant holds a flank approach. The contested vulnerability is the economic and logistical cost of keeping the corridor open under sustained standoff fires at extreme distance."
osint_sources = [
    "IISS Military Balance entries on Arctic basing, long-range fires, and uncrewed standoff-strike reach envelopes",
    "CRS reporting on Arctic strategy, sea-route opening, and the allied vs. Russian Arctic force-posture gap",
    "RAND public research on Arctic security, distance/logistics constraints, and great-power competition in the high north",
    "Published open analyses of Arctic shipping-corridor economics and icebreaker / escort dependence",
]
sensitivity_parameters = [
    "standoff-fires per-engagement damage (force_projection.damage)",
    "standoff-fires reach in km (force_projection.range -> adjacency hops)",
    "coalition forward-picket starting strength",
    "Arctic environmental window detection / visibility factors",
]

# ============================================================================
# Map — Arctic corridor as a high-latitude geographic chain
# ============================================================================
#
# A linear-plus-flank corridor running from the Northern Power's coast
# through a contested chokepoint to the coalition home approaches:
#
#   northern_outpost (NP rear; standoff-fires element sits here)
#     -- corridor_chokepoint (the navigable narrows; Coalition forward picket)
#         -- coalition_approaches (Coalition deep garrison / home waters)
#   flank_approach (Coastal Claimant; borders the chokepoint)
#
# A ~600 km standoff reach from the outpost is ~4 adjacency hops at the
# ~150 km/hop mapping the engine uses; the chokepoint is 1 hop away and
# the coalition approaches are 2 hops, so both forward Coalition positions
# sit inside the reach envelope while the outpost itself never moves.

[map]
[map.source]
type = "Grid"
width = 2
height = 2

[map.regions.northern_outpost]
id = "northern_outpost"
name = "Northern Power Island Outpost"
population = 4_000
urbanization = 0.3
initial_control = "northern_power"
