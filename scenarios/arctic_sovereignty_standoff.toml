# ============================================================================
# Environment — Arctic conditions suppress detection and visibility
# ============================================================================
#
# A persistent Arctic-conditions window (polar dark / weather) degrades
# visibility on Arctic terrain and suppresses the global detection factor,
# modeling the documented difficulty of sustained ISR over the high north.
# A periodic deep-weather cycle deepens the effect intermittently.

[[environment.windows]]
id = "polar_conditions"
name = "Polar Conditions"
activation = { type = "Always" }
applies_to = ["Arctic"]
visibility_factor = 0.7
detection_factor = 0.8

[[environment.windows]]
id = "deep_weather"
name = "Deep Weather Window"
activation = { type = "Cycle", period = 12, phase = 0, duration = 4 }
applies_to = ["Arctic", "Coastal"]
defense_factor = 1.2
visibility_factor = 0.6
detection_factor = 0.7

