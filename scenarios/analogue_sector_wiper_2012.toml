# -- Kill chain: staged destructive detonation -----------------------------
#
# Four short phases. Once the destructive payload is staged from existing
# internal access, detonation is near-certain and fast (high success, low
# detection in the staging window). Cumulative destructive-impact pressure
# crosses the 0.55 threshold within a few days — the
# detonation-plus-degradation window before rebuild-led recovery. High
# base success probabilities reflect the existing internal access and the
# limited segmentation.

[kill_chains.wiper_op]
id = "wiper_op"
name = "Staged Destructive Detonation"
description = "Aggregate model of the single-target destructive action: leveraging existing internal access, staging the destructive payload, coordinated detonation, and mass workstation destruction."
attacker = "sector_wiper"
target = "energy_company"
entry_phase = "leverage_access"

[kill_chains.wiper_op.phases.leverage_access]
id = "leverage_access"
name = "Leverage Existing Internal Access"
description = "Aggregate model of consolidating existing internal access and reach across the corporate estate. Effect-level only; no technique detail."
prerequisites = []
base_success_probability = 0.95
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.02
attribution_difficulty = 0.8
targets_domains = ["NetworkSecurity"]

[[kill_chains.wiper_op.phases.leverage_access.outputs]]
type = "CoercionPressure"
delta = 0.14

[[kill_chains.wiper_op.phases.leverage_access.branches]]
condition = { type = "OnSuccess" }
next_phase = "stage_payload"

[kill_chains.wiper_op.phases.stage_payload]
id = "stage_payload"
name = "Stage Destructive Payload"
description = "Aggregate model of distributing the destructive payload to staging points across the corporate workstation estate ahead of detonation."
prerequisites = ["leverage_access"]
base_success_probability = 0.94
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.02
prerequisite_success_boost = 0.05
attribution_difficulty = 0.8
targets_domains = ["NetworkSecurity", "SupplyChainSecurity"]

[[kill_chains.wiper_op.phases.stage_payload.outputs]]
type = "CoercionPressure"
delta = 0.16

[[kill_chains.wiper_op.phases.stage_payload.branches]]
condition = { type = "OnSuccess" }
next_phase = "coordinated_detonation"

[kill_chains.wiper_op.phases.coordinated_detonation]
id = "coordinated_detonation"
name = "Coordinated Detonation"
description = "Aggregate model of the single coordinated trigger that begins disk overwriting across the staged hosts simultaneously."
prerequisites = ["stage_payload"]
base_success_probability = 0.95
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.8
targets_domains = ["SupplyChainSecurity"]

[[kill_chains.wiper_op.phases.coordinated_detonation.outputs]]
type = "CoercionPressure"
delta = 0.18

[[kill_chains.wiper_op.phases.coordinated_detonation.branches]]
condition = { type = "OnSuccess" }
next_phase = "mass_destruction"

[kill_chains.wiper_op.phases.mass_destruction]
id = "mass_destruction"
name = "Mass Workstation Destruction"
description = "Terminal phase. Aggregate model of the disk-overwriting effect rendering ~30,000 corporate workstations inoperable, degrading business operations until rebuild."
