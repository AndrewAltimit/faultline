# -- Simulation Config ------------------------------------------------------
#
# 18-day cap brackets the documented detonation-plus-degradation window
# with headroom. One tick = one day. The attacker wins by crossing the
# destructive-impact (CoercionPressure) threshold; the defender wins only
# by keeping its workstation estate operational for the full horizon.

[simulation]
max_ticks = 18
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 2012
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Days = 1

