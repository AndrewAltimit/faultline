# Historical-analogue scenario
# =============================
#
# Single named-event analogue: the August 2012 destructive-malware
# availability incident against a single named-sector target — a major
# national energy company. An intrusion set with prior network access
# detonated a destructive (disk-overwriting) payload that rendered on the
# order of 30,000 workstations inoperable in a single coordinated action,
# disrupting the company's corporate IT for a sustained period before
# rebuild-led recovery. It is a canonical public example of a single-target
# destructive availability event in a critical sector — distinct from a
# self-propagating supply-chain wiper — which makes it a clean single-event
# calibration analogue.
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("sector_wiper"): a destructive intrusion set that, having
#   already obtained internal access, staged and detonated a
#   disk-overwriting payload across the target's corporate workstation
#   estate in a single coordinated action timed for maximum disruption.
# Defender ("energy_company"): a major national energy company whose
#   corporate IT estate (workstations, file shares, business systems)
#   had limited internal segmentation and host-recovery automation at the
#   time, so the destructive action degraded business operations until a
#   large-scale rebuild restored systems.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# malware internals, no exploit detail, no implementation specifics)
# ---------------------------------------------------------------------
# - Kill-chain shape (existing internal access → staging of the
#   destructive payload → coordinated detonation → mass workstation
#   destruction → rebuild-led recovery) is drawn from public incident
#   reporting and defensive-community analyses of the 2012 event. Only the
#   AGGREGATE phase structure and public outcome are encoded — no malware
#   internals or exploit detail.
# - Outcome: attacker-success at the scale of disruption — on the order
#   of 30,000 workstations rendered inoperable in a single action,
#   degrading corporate operations for a sustained period. Encoded as
#   high phase-success probabilities and an attacker win on the
#   destructive-impact metric.
# - Duration: the destructive action itself was effectively
#   simultaneous, with the resulting outage and rebuild spanning days to
#   a couple of weeks per public reporting. Modeled at one tick = one day
#   over a short horizon; the duration band brackets the documented
#   detonation-plus-degradation window with two-sided uncertainty.
#
# All figures (~30,000 workstations destroyed, single-target destructive
# action against a national energy company, rebuild-led recovery) are
# from public reporting and contain no classified, CUI, or
# export-controlled material.

[meta]
schema_version = 1
name = "Analogue — Sector-Targeted Destructive Wiper (Aug 2012)"
description = """
Single-event historical analogue: the August 2012 destructive-malware
availability incident against a single major national energy company. An
intrusion set with existing internal access detonated a disk-overwriting
payload that rendered on the order of 30,000 workstations inoperable in a
single coordinated action, degrading corporate operations for a sustained
period before a large-scale rebuild restored systems — a canonical public
example of a single-target destructive availability event in a critical
sector. The documented attacker-success outcome and short
(detonation-plus-degradation) duration are encoded as calibration
observations and back-tested against the Monte Carlo distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public incident reporting and defensive-community
analyses. No malware internals, exploit detail, classified, CUI, or
export-controlled material is encoded — only the aggregate statistical
effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "wiper", "destructive", "energy-sector"]
confidence = "High"

[meta.historical_analogue]
name = "August 2012 sector-targeted destructive wiper"
description = """
A destructive-malware action against a single major national energy
company that rendered ~30,000 corporate workstations inoperable in a
single coordinated detonation, degrading business operations for days to
a couple of weeks before rebuild-led recovery. The analogue back-tests
whether this scenario's kill-chain parameters reproduce both the
documented victor (the attacker, on the destructive-impact metric) and
the documented short detonation-plus-degradation duration.
"""
period = "2012-08-15"
sources = [
    "Public incident reporting on the August 2012 sector-targeted destructive event",
    "Congressional Research Service reporting on cyber threats to energy-sector infrastructure",
    "Published academic / defensive-community analyses of single-target destructive malware",
    "Public reporting on the scale of impact (~30,000 workstations rendered inoperable)",
]
confidence = "High"

# Documented victor: the attacker achieved mass destructive impact.
[[meta.historical_analogue.observations]]
notes = "Public reporting: the destructive action rendered ~30,000 corporate workstations inoperable at a single named energy company in one coordinated detonation."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "sector_wiper"

# Win-rate band: a staged destructive action from existing internal
# access against an estate with limited segmentation and host-recovery
# automation achieves mass impact with very high reliability once
# detonated. Band kept wide for single-case uncertainty.
[[meta.historical_analogue.observations]]
notes = "A staged destructive action from existing internal access against limited segmentation achieves mass impact with very high reliability once detonated; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "sector_wiper"
low = 0.75
high = 1.0

# Duration: detonation effectively simultaneous; outage and rebuild
# spanned days to a couple of weeks. One tick = one day; interval [2, 14]
# brackets the detonation-plus-degradation window.
[[meta.historical_analogue.observations]]
notes = "Detonation was effectively simultaneous; the resulting outage and rebuild spanned days to a couple of weeks. Modeled at one tick = one day; band brackets the window."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 2
high = 14

