# Historical-analogue scenario
# =============================
#
# Single named-event analogue: the spring 1999 coercive air campaign
# over the Balkans, modeled as a sustained air-pressure operation whose
# documented end state was the adversary's acceptance of a negotiated
# withdrawal after roughly eleven weeks of bombing. It is one of the
# best-documented modern cases of coercion-by-airpower, which makes it a
# clean single-event calibration analogue for a kinetic-coercion episode
# resolved without a ground invasion.
#
# ---------------------------------------------------------------------
# Modeling choice (read this first)
# ---------------------------------------------------------------------
# Faultline's combat model resolves attrition only where opposing forces
# co-locate, and the AI will not assault a defended interior, so a clean
# "victory by conquest" verdict is not reliably reachable at realistic
# force ratios over a short horizon. The decisive feature of this
# campaign was not territorial seizure but the COERCION of the target
# government into accepting terms. It is therefore modeled at the level
# of COERCIVE PRESSURE: the air coalition runs a phased campaign whose
# successful phases accumulate the engine's generic `CoercionPressure`
# metric, and the run resolves when that pressure crosses the target's
# political-resilience threshold — i.e. the point at which the target
# accepts the negotiated terms. This is the engine's reliable,
# well-instrumented subsystem (kill chains + non-kinetic accumulators)
# and is the analytically honest way to encode "air pressure compelled a
# settlement in weeks."
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Coercer ("air_coalition"): a large multinational air coalition with
#   decisive air superiority conducting a phased campaign — air-defense
#   suppression, fielded-force and fixed-target strikes, then escalation
#   to strategic infrastructure and leadership-relevant targets — to
#   raise the political cost of continued resistance.
# Target ("target_state"): a medium conventional state with a layered
#   but outmatched integrated air-defense system and limited strategic
#   depth, defending home territory and a contested province.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# order-of-battle reconstruction, no targeting detail, no classified or
# CUI material)
# ---------------------------------------------------------------------
# - Air dominance: open-source post-conflict analyses (IISS Military
#   Balance editions for the period; RAND and other public assessments
#   of the air campaign) describe decisive coalition air superiority
#   against an outmatched, if resilient, integrated air-defense system.
#   Encoded as high base success probabilities on the campaign's
#   pressure phases (an overmatched coercive air campaign rarely stalls
#   outright), not as a literal aircraft-count ratio.
# - Duration: the campaign ran roughly eleven weeks (late March to early
#   June 1999) before the target accepted withdrawal terms, per the
#   widely-reported public timeline. Modeled at one tick = three days
#   over a multi-week horizon, so ~11 weeks maps to the mid-teens of
#   ticks; the duration band brackets this with two-sided uncertainty.
# - Outcome: the coalition achieved its coercive objective — the target
#   accepted a negotiated withdrawal — a decisive coercer result.
#
# All figures (eleven-week campaign, air-superiority overmatch, coerced
# withdrawal) are from public reporting and contain no classified, CUI,
# or export-controlled material.

[meta]
schema_version = 1
name = "Analogue — Coercive Air Campaign (Spring 1999)"
description = """
Single-event historical analogue: the spring 1999 coercive air campaign
over the Balkans, modeled as a sustained air-pressure operation. A large
multinational air coalition coerces a medium conventional state into
accepting a negotiated withdrawal after roughly eleven weeks of bombing.
The documented outcome — decisive coercer success in weeks, without a
ground invasion — is encoded as calibration observations and back-tested
against the Monte Carlo distribution. The coercion is modeled via the
engine's non-kinetic `CoercionPressure` accumulator (its reliable
kill-chain subsystem) rather than territorial seizure; see the header
comment for the rationale.

Parameters are aggregate phase success / duration / pressure values
sourced from public OSINT (IISS Military Balance, RAND and other public
post-conflict assessments of the air campaign, academic
coercion-by-airpower literature, the public campaign timeline). No
order-of-battle reconstruction, targeting detail, classified, CUI, or
export-controlled material is encoded — only the aggregate statistical
effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "air-campaign", "coercion", "inter-state", "kinetic"]
confidence = "Medium"

[meta.historical_analogue]
name = "Spring 1999 coercive air campaign — coerced withdrawal"
description = """
The roughly eleven-week air campaign (late March to early June 1999)
ending in the target state's acceptance of a negotiated withdrawal. A
large multinational air coalition coerced a medium conventional state
into terms without a ground invasion. The analogue back-tests whether
this scenario's coercion-campaign parameters reproduce both the
documented victor (the coalition) and the documented multi-week duration.
"""
period = "1999-03-24 to 1999-06-10"
sources = [
    "IISS Military Balance (annual editions covering 1998-2000)",
    "RAND and other public post-conflict assessments of the 1999 air campaign",
    "Academic literature on coercion by airpower and air-campaign outcomes",
    "Public campaign timeline reporting (late March to early June 1999)",
]
confidence = "Medium"

# Documented victor: the coalition coerced acceptance of withdrawal terms.
[[meta.historical_analogue.observations]]
notes = "Public post-conflict consensus: the air coalition achieved its coercive objective and the target accepted a negotiated withdrawal."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "air_coalition"

# Win-rate band: a sustained coercive air campaign with decisive air
# superiority against an outmatched target succeeds at a high rate. Band
# kept wide for single-case + reference-set uncertainty.
[[meta.historical_analogue.observations]]
notes = "Coercer success rate for sustained air campaigns with decisive air superiority against an outmatched target is high; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "air_coalition"
low = 0.65
high = 1.0

# Duration: ~11 weeks at one tick = three days maps to roughly the
# mid-teens of ticks. Interval [8, 22] brackets the documented figure
# with two-sided uncertainty.
[[meta.historical_analogue.observations]]
notes = "Campaign ran ~11 weeks (late March to early June 1999); at one tick = three days this maps to roughly the mid-teens of ticks. Band brackets it on both sides."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 8
high = 22

