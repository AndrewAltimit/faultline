# -- Kill chain: phased coercive air campaign ------------------------------
#
# Four phases, each 2-4 ticks (one tick = three days), each emitting
# CoercionPressure on success. Cumulative pressure crosses the 0.55
# acceptance threshold around the mid-teens of ticks — the ~11-week
# campaign. High base success probabilities encode decisive air
# superiority (a coercive air campaign at this overmatch rarely stalls);
# the phased structure and the per-phase durations encode the gradual,
# escalating nature of coercion by airpower.

[kill_chains.air_coercion]
id = "air_coercion"
name = "Phased Coercive Air Campaign"
description = "Aggregate model of a phased air campaign (air-defense suppression, fielded-force and fixed-target strikes, strategic-infrastructure escalation, sustained pressure) compelling the target state to accept withdrawal terms."
attacker = "air_coalition"
target = "target_state"
entry_phase = "suppress_air_defenses"

[kill_chains.air_coercion.phases.suppress_air_defenses]
id = "suppress_air_defenses"
name = "Suppress Air Defenses & Establish Control"
description = "Aggregate model of suppressing the integrated air-defense system and establishing freedom of action over the theatre."
prerequisites = []
base_success_probability = 0.93
min_duration = 2
max_duration = 4
detection_probability_per_tick = 0.0
attribution_difficulty = 0.1
targets_domains = ["PhysicalSecurity"]

[[kill_chains.air_coercion.phases.suppress_air_defenses.outputs]]
type = "CoercionPressure"
delta = 0.14

[[kill_chains.air_coercion.phases.suppress_air_defenses.outputs]]
type = "InfraDamage"
region = "target_interior"
factor = 0.3

[[kill_chains.air_coercion.phases.suppress_air_defenses.branches]]
condition = { type = "OnSuccess" }
next_phase = "fielded_force_strikes"

[kill_chains.air_coercion.phases.fielded_force_strikes]
id = "fielded_force_strikes"
name = "Fielded-Force & Fixed-Target Strikes"
description = "Aggregate model of sustained strikes against fielded forces and fixed targets in the contested province, attriting the target's military capacity."
prerequisites = ["suppress_air_defenses"]
base_success_probability = 0.93
min_duration = 2
max_duration = 4
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.1
targets_domains = ["PhysicalSecurity"]

[[kill_chains.air_coercion.phases.fielded_force_strikes.outputs]]
type = "CoercionPressure"
delta = 0.16

[[kill_chains.air_coercion.phases.fielded_force_strikes.outputs]]
type = "MoraleDelta"
faction = "target_state"
delta = -0.1

[[kill_chains.air_coercion.phases.fielded_force_strikes.branches]]
condition = { type = "OnSuccess" }
next_phase = "strategic_escalation"

[kill_chains.air_coercion.phases.strategic_escalation]
id = "strategic_escalation"
name = "Strategic-Infrastructure Escalation"
description = "Aggregate model of escalation to strategic infrastructure (power, command, transport) in the interior, raising the political cost of continued resistance."
prerequisites = ["fielded_force_strikes"]
base_success_probability = 0.93
min_duration = 2
max_duration = 4
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.1
targets_domains = ["PhysicalSecurity"]

[[kill_chains.air_coercion.phases.strategic_escalation.outputs]]
type = "CoercionPressure"
delta = 0.18

[[kill_chains.air_coercion.phases.strategic_escalation.outputs]]
type = "InfraDamage"
region = "target_interior"
factor = 0.5

[[kill_chains.air_coercion.phases.strategic_escalation.branches]]
condition = { type = "OnSuccess" }
next_phase = "compel_acceptance"

[kill_chains.air_coercion.phases.compel_acceptance]
id = "compel_acceptance"
name = "Sustained Pressure — Compel Acceptance"
description = "Terminal phase. Aggregate model of sustained pressure compelling the target state to accept the negotiated withdrawal terms."
prerequisites = ["strategic_escalation"]
base_success_probability = 0.93
min_duration = 2
max_duration = 4
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.1
targets_domains = ["ExecutiveProtection"]

[[kill_chains.air_coercion.phases.compel_acceptance.outputs]]
type = "CoercionPressure"
delta = 0.2

# -- Simulation Config ------------------------------------------------------
#
# 30-tick cap (one tick = three days, ~90 days) brackets the documented
# ~11-week campaign with headroom. The coalition wins by crossing the
# acceptance (CoercionPressure) threshold; the target wins only by
# surviving the full horizon with its political resilience intact.

[simulation]
max_ticks = 30
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 1999
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Days = 3

# -- Victory Conditions -----------------------------------------------------

# Coercer objective: compel acceptance of withdrawal terms (cumulative
# CoercionPressure crosses the target's political-resilience threshold).
[victory_conditions.coerced_withdrawal]
id = "coerced_withdrawal"
name = "Air Coalition Compels Withdrawal"
faction = "air_coalition"

[victory_conditions.coerced_withdrawal.condition]
type = "NonKineticThreshold"
metric = "CoercionPressure"
threshold = 0.55

# Defender objective: hold the interior for the full horizon without
# being coerced into a settlement.
[victory_conditions.target_resistance]
id = "target_resistance"
name = "Target State Resists Coercion"
faction = "target_state"

[victory_conditions.target_resistance.condition]
type = "HoldRegions"
regions = ["target_interior"]
duration = 30
