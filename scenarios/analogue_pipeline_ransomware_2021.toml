# -- Kill chain: intrusion to precautionary shutdown -----------------------
#
# Five short phases mirroring the public incident timeline. Each
# successful phase emits CoercionPressure (a generic disruption metric
# here) and the later phases damage business / pipeline infrastructure.
# Cumulative pressure crosses the 0.55 disruption threshold within the
# first several days — the precautionary shutdown and ensuing fuel
# disruption. High base success probabilities reflect the documented IT
# exposure and a precaution-toward-shutdown operator posture.

