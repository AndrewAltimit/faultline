description = "Aggregate model of the May 2021 incident: credential-based initial access, data exfiltration, ransomware deployment encrypting business systems, the operator's precautionary operational shutdown, and the ensuing fuel-delivery disruption."
attacker = "ransom_operator"
target = "pipeline_operator"
