# Historical-analogue scenario
# =============================
#
# Single named-event analogue: the May 2021 ransomware incident against
# the operator of the largest refined-products pipeline on the U.S. East
# Coast. A ransomware intrusion into the operator's business (IT) network
# led the operator to proactively shut down pipeline operations as a
# precaution, halting fuel delivery for roughly six days and triggering
# regional fuel-supply disruption and panic buying before operations were
# restored. The incident is extensively documented in OPEN U.S.
# government and defensive-community sources, which makes it a clean
# single-event calibration analogue for a pipeline / fuel-logistics
# disruption driven by a cyber intrusion (as distinct from a grid or
# wiper event).
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("ransom_operator"): a financially-motivated ransomware
#   operation that obtained access to the operator's corporate IT
#   environment via a compromised credential, exfiltrated data, and
#   deployed ransomware that encrypted business systems — the disruption
#   of the IT environment was the proximate cause of the operational
#   shutdown.
# Defender ("pipeline_operator"): the operator of a major refined-products
#   pipeline whose business (IT) and billing systems were impacted, and
#   which proactively halted pipeline operations because it could not be
#   certain the operational (OT) side was unaffected.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# exploit detail, no malware internals, no implementation specifics)
# ---------------------------------------------------------------------
# - Kill-chain shape (credential-based initial access -> data
#   exfiltration -> ransomware deployment encrypting business systems ->
#   precautionary operational shutdown -> sustained fuel-delivery
#   disruption) is drawn from public U.S. government reporting
#   (Congressional Research Service, U.S. Government Accountability
#   Office, TSA/CISA public advisories) and published congressional
#   testimony by the operator. Only the AGGREGATE phase structure and
#   public outcome are encoded — no exploit or malware internals.
# - Outcome: a successful disruption. The pipeline was shut down for
#   roughly six days; fuel deliveries halted across the U.S. Southeast /
#   East Coast; the disruption was widely felt before restoration.
#   Encoded as high phase-success probabilities and an attacker win on
#   the fuel-disruption metric.
# - Duration: the shutdown lasted roughly six days (early-to-mid May
#   2021), here modeled at one tick = one day over a short horizon.
#
# All figures (~6-day shutdown of a major refined-products pipeline,
# regional fuel disruption, kill-chain stages) are from public reporting
# and contain no classified, CUI, or export-controlled material.

[meta]
schema_version = 1
name = "Analogue — Major Fuel-Pipeline Ransomware Shutdown (May 2021)"
description = """
Single-event historical analogue: the May 2021 ransomware incident
against the operator of the largest refined-products pipeline on the
U.S. East Coast. A financially-motivated intrusion into the operator's
business (IT) network led to a precautionary shutdown of pipeline
operations, halting fuel delivery for roughly six days and triggering
regional supply disruption and panic buying before operations resumed.
The documented disruption outcome and short (days) duration are encoded
as calibration observations and back-tested against the Monte Carlo
distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public U.S. government reporting (CRS, GAO, TSA/CISA
public advisories) and published congressional testimony. No exploit
detail, malware internals, classified, CUI, or export-controlled
material is encoded — only the aggregate statistical effects the engine
consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "ransomware", "pipeline", "infrastructure", "logistics"]
confidence = "High"
scenario_type = "reference"
analytical_purpose = "Does the engine reproduce the documented disruption outcome and roughly-six-day duration of the May 2021 fuel-pipeline ransomware shutdown?"
red_team_profile = "Financially-motivated ransomware operation: credential-based initial access to the corporate IT environment, data exfiltration, and ransomware deployment that encrypted business systems — the IT disruption was the proximate cause of the precautionary operational shutdown."
blue_team_posture = "Operator of a major refined-products pipeline whose business and billing systems were impacted and which proactively halted pipeline operations because it could not be certain the operational side was unaffected."
osint_sources = [
    "Congressional Research Service reporting on the May 2021 pipeline ransomware incident",
    "U.S. Government Accountability Office reporting on pipeline cybersecurity",
    "TSA / CISA public security advisories on pipeline cybersecurity",
    "Published congressional testimony by the pipeline operator on the incident timeline",
]
sensitivity_parameters = [
    "kill-chain phase success probabilities (initial access -> exfiltration -> ransomware deployment -> precautionary shutdown)",
    "fuel-delivery disruption phase duration",
]

[meta.historical_analogue]
name = "May 2021 fuel-pipeline ransomware shutdown"
description = """
A financially-motivated ransomware intrusion into the corporate IT
network of the operator of the largest refined-products pipeline on the
U.S. East Coast led the operator to proactively shut down pipeline
operations for roughly six days, halting fuel delivery across the
Southeast / East Coast and triggering regional supply disruption before
restoration. The analogue back-tests whether this scenario's kill-chain
parameters reproduce both the documented victor (the attacker, on the
fuel-disruption metric) and the documented short (days) duration.
"""
period = "2021-05-07 to 2021-05-12"
sources = [
    "Congressional Research Service reporting on the May 2021 pipeline ransomware incident",
    "U.S. Government Accountability Office reporting on pipeline cybersecurity",
    "TSA / CISA public security advisories on pipeline cybersecurity",
    "Published congressional testimony by the pipeline operator on the incident timeline",
]
confidence = "High"

# Documented victor: the intrusion forced a precautionary shutdown that
# disrupted fuel delivery.
[[meta.historical_analogue.observations]]
notes = "Public U.S. government reporting and operator testimony: the intrusion forced a precautionary shutdown of the pipeline, halting fuel delivery for several days."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "ransom_operator"

# Win-rate band: against a corporate IT environment reachable via a
# single compromised credential and an operator posture that precautions
# toward shutdown, an intrusion of this maturity disrupts operations at a
# high rate. Band kept wide for single-case uncertainty.
[[meta.historical_analogue.observations]]
notes = "Against the documented IT exposure and a precaution-toward-shutdown operator posture, an intrusion of this maturity disrupts operations at a high rate; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "ransom_operator"
low = 0.70
high = 1.0

# Duration: the shutdown lasted roughly six days. One tick = one day;
# interval [3, 12] brackets the documented ~six-day window on both sides.
[[meta.historical_analogue.observations]]
notes = "The shutdown lasted roughly six days (early-to-mid May 2021) before operations resumed; modeled at one tick = one day. Band brackets the window on both sides."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 3
high = 12

