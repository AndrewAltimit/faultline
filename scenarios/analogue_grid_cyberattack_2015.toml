# -- Simulation Config ------------------------------------------------------
#
# 16-hour cap brackets the documented several-hour event with headroom.
# One tick = one hour. The attacker wins by crossing the outage
# (CoercionPressure) threshold; the defender wins only by holding its
# service territory intact for the full horizon.

[simulation]
max_ticks = 16
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 2015
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Hours = 1

