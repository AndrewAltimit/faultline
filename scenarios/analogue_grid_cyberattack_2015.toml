# -- Kill chain: ICS intrusion to outage -----------------------------------
#
# Five short phases mirroring the public incident analysis. Each
# successful phase emits CoercionPressure (a generic disruption metric
# here) and the terminal phases damage the grid infrastructure.
# Cumulative pressure crosses the 0.55 outage threshold around tick 4-7
# — the several-hour event. High base success probabilities reflect the
# documented 2015 defensive posture.

[kill_chains.grid_op]
id = "grid_op"
name = "ICS Intrusion to Grid Outage"
description = "Aggregate model of the multi-stage 2015 grid intrusion: initial access, lateral movement into the operational network, SCADA/HMI manipulation, breaker operation, and recovery obstruction."
attacker = "grid_intruder"
target = "grid_operator"
entry_phase = "initial_access"

[kill_chains.grid_op.phases.initial_access]
id = "initial_access"
name = "Spearphishing — Initial Access"
description = "Aggregate model of spearphishing-led initial access to the corporate IT environment. Effect-level only; no payload or technique detail."
prerequisites = []
base_success_probability = 0.95
min_duration = 1
max_duration = 1
detection_probability_per_tick = 0.02
attribution_difficulty = 0.7
targets_domains = ["NetworkSecurity"]

[[kill_chains.grid_op.phases.initial_access.outputs]]
type = "CoercionPressure"
delta = 0.15

[[kill_chains.grid_op.phases.initial_access.branches]]
