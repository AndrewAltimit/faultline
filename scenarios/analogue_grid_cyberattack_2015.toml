# Historical-analogue scenario (Epic N round-two)
# =================================================
#
# Single named-event analogue: the December 2015 attack on a regional
# electricity distribution operator that caused a multi-hour outage
# affecting on the order of 225,000 customers. This is the first
# publicly-confirmed cyberattack to cause a power outage, and its
# kill chain is unusually well documented in OPEN sources, which makes
# it an ideal single-event calibration analogue for an
# infrastructure / SCADA-ICS incident.
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("grid_intruder"): a capable, well-resourced intrusion set
#   that ran a multi-stage operation — spearphishing for initial
#   access, credential theft and lateral movement into the operational
#   network, manipulation of operator HMIs to open breakers, and
#   destructive / availability actions (firmware corruption of serial
#   converters; telephone-system flooding) to slow recovery.
# Defender ("grid_operator"): a regional distribution utility whose
#   operational network was reachable from the corporate network and
#   whose operators were displaced from their own HMIs during the event.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# exploit detail, no malware internals, no implementation specifics)
# ---------------------------------------------------------------------
# - Kill-chain shape (phish → credential theft / lateral movement →
#   SCADA/HMI manipulation → breaker operation → recovery obstruction)
#   is drawn from the public defensive-community incident analysis
#   (E-ISAC / SANS public report) and the U.S. ICS-CERT public alert
#   (IR-ALERT-H-16-056-01). Only the AGGREGATE phase structure and
#   public outcome are encoded — no exploit or malware internals.
# - Outcome: a successful attacker. Roughly 225,000 customers lost
#   power; the outage lasted several hours; manual operation restored
#   service. Encoded as high phase-success probabilities and an
#   attacker win.
# - Duration: the disruptive event unfolded over hours, here modeled at
#   one tick = one hour over a short horizon.
#
# All figures (~225k customers, multi-hour outage, kill-chain stages)
# are from public reporting and contain no classified, CUI, or
# export-controlled material.

[meta]
schema_version = 1
name = "Analogue — Regional Grid Cyberattack (Dec 2015)"
description = """
Single-event historical analogue: the December 2015 cyberattack on a
regional electricity distribution operator — the first publicly
confirmed cyber-induced power outage. A capable intrusion set ran a
multi-stage operation (spearphishing → credential theft / lateral
movement → SCADA/HMI manipulation → breaker operation → recovery
obstruction) that cut power to on the order of 225,000 customers for
several hours. The documented attacker-success outcome and short
(hours) duration are encoded as calibration observations and
back-tested against the Monte Carlo distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public defensive-community analysis (E-ISAC / SANS
public incident report) and the U.S. ICS-CERT public alert. No exploit
detail, malware internals, classified, CUI, or export-controlled
material is encoded — only the aggregate statistical effects the engine
consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "scada-ics", "infrastructure", "grid"]
confidence = "High"
scenario_type = "reference"
analytical_purpose = "Does the engine reproduce the documented attacker-success outcome and multi-hour duration of the first publicly confirmed cyber-induced power outage?"
red_team_profile = "Capable, well-resourced intrusion set running a multi-stage operation: spearphishing for initial access, credential theft and lateral movement into the operational network, HMI manipulation to open breakers, and destructive/availability actions to slow recovery."
blue_team_posture = "Regional distribution utility whose operational network was reachable from the corporate network and whose operators were displaced from their own HMIs during the event."
osint_sources = [
    "E-ISAC / SANS public incident analysis of the December 2015 grid attack",
    "U.S. ICS-CERT public alert IR-ALERT-H-16-056-01",
    "Open press reporting on the ~225,000-customer multi-hour outage",
]
sensitivity_parameters = [
    "kill-chain phase success probabilities (phish -> lateral movement -> SCADA/HMI manipulation -> breaker operation)",
    "recovery-obstruction phase duration",
]

[meta.historical_analogue]
name = "December 2015 regional grid cyberattack"
description = """
The first publicly confirmed cyberattack to cause a power outage. A
multi-stage intrusion manipulated distribution-operator control systems
to open breakers, cutting power to ~225,000 customers for several hours
before manual restoration. The analogue back-tests whether this
scenario's kill-chain parameters reproduce both the documented victor
(the attacker) and the documented short (hours) duration.
"""
period = "2015-12-23"
sources = [
    "E-ISAC / SANS public incident analysis of the December 2015 grid attack",
    "U.S. ICS-CERT public alert IR-ALERT-H-16-056-01 (cyber-attack against critical infrastructure)",
    "Congressional Research Service reporting on grid cybersecurity",
    "Published academic / defensive-community analyses of ICS/SCADA intrusion campaigns",
]
confidence = "High"

# Documented victor: the attacker achieved a power outage.
[[meta.historical_analogue.observations]]
notes = "Public incident analysis: the intrusion succeeded in opening breakers and causing an outage affecting ~225,000 customers."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "grid_intruder"

# Win-rate band: the operation succeeded; against the 2015 defensive
# posture (flat-ish network reachability, limited ICS segmentation) a
# campaign of this maturity has a high success rate. Band kept wide.
[[meta.historical_analogue.observations]]
notes = "A campaign of this maturity against the documented 2015 defensive posture has a high success rate; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "grid_intruder"
low = 0.70
high = 1.0

# Duration: the disruptive event unfolded over hours. One tick = one
# hour; interval [2, 10] brackets the several-hour event.
[[meta.historical_analogue.observations]]
notes = "The disruptive phase unfolded over several hours before manual restoration; modeled at one tick = one hour."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 2
high = 10

