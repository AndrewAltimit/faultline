# -- Events: false-flag deception ------------------------------------------

# Tick 2: red plants a false-flag region-control belief in blue's mind
# — blue is led to believe gray_partner controls north_east (red's
# actual home region). The `Deceived` source tag persists through
# decay, so every believed-attribution roll blue makes for the rest of
# the run is biased toward gray. This is the mechanism that turns a
# low-intelligence defender's confusion into a *directed*
# misattribution at a specific innocent party.
[events.red_false_flag]
id = "red_false_flag"
name = "Red False-Flag (Frame Gray)"
description = "Red leaks fabricated evidence that gray_partner is operating out of north_east, framing gray for red's own covert campaign."
probability = 1.0
repeatable = false

[[events.red_false_flag.conditions]]
condition = "TickAtLeast"
tick = 2

[[events.red_false_flag.effects]]
effect = "DeceptionOp"
source_faction = "red_attacker"
target_faction = "blue_defender"

[events.red_false_flag.effects.payload]
kind = "FalseRegionControl"
region = "north_east"
false_controller = "gray_partner"

# -- Simulation Config ------------------------------------------------------

[simulation]
max_ticks = 60
monte_carlo_runs = 100
fog_of_war = false
snapshot_interval = 0
seed = 23

[simulation.tick_duration]
Days = 1

[simulation.attrition_model]
Stochastic = { noise = 0.1 }

# Belief-asymmetry model — Epic M. `believed_attribution = true` routes
# kill-chain attribution through blue's belief instead of ground truth.
# Without `enabled = true` the sub-flag is rejected at load; without a
# kill chain it is rejected at load (it would be a silent no-op).
[simulation.belief_model]
enabled = true
believed_attribution = true
force_decay_per_tick = 0.05
region_decay_per_tick = 0.0
scalar_decay_per_tick = 0.03
prune_threshold = 0.0
snapshot_interval = 0

# -- Kill Chain ------------------------------------------------------------
#
# A short three-phase covert chain run by red against blue. Detection
# probabilities are tuned so blue detects phases across most runs (each
# detection is one believed-attribution roll). attribution_difficulty
# is moderate so the per-detection attribution confidence is meaningful.

[kill_chains.covert_op]
id = "covert_op"
name = "Covert Operation (Red)"
description = "Three-phase covert chain whose detections drive blue's believed-attribution rolls. The true attacker is red, but the false flag biases blue toward attributing it to gray."
attacker = "red_attacker"
target = "blue_defender"
entry_phase = "approach"

[kill_chains.covert_op.phases.approach]
id = "approach"
name = "Approach"
description = "Initial reconnaissance. High detection probability so blue forms an (often wrong) attribution early."
base_success_probability = 0.85
min_duration = 3
max_duration = 6
detection_probability_per_tick = 0.18
prerequisite_success_boost = 0.0
attribution_difficulty = 0.45
targets_domains = ["SignalsIntelligence"]

[kill_chains.covert_op.phases.approach.cost]
attacker_dollars = 1_000.0
defender_dollars = 5_000.0
attacker_resources = 0.5

[[kill_chains.covert_op.phases.approach.branches]]
condition = { type = "OnDetection" }
next_phase = "exploit"

[[kill_chains.covert_op.phases.approach.branches]]
condition = { type = "OnSuccess" }
next_phase = "exploit"

[kill_chains.covert_op.phases.exploit]
id = "exploit"
name = "Exploit"
description = "Mid-chain action. Continues to generate detections / attribution rolls."
base_success_probability = 0.70
min_duration = 4
max_duration = 8
detection_probability_per_tick = 0.16
prerequisite_success_boost = 0.0
attribution_difficulty = 0.40
targets_domains = ["SignalsIntelligence"]

[kill_chains.covert_op.phases.exploit.cost]
attacker_dollars = 3_000.0
defender_dollars = 15_000.0
attacker_resources = 1.5

[[kill_chains.covert_op.phases.exploit.branches]]
condition = { type = "OnDetection" }
next_phase = "exfil"

[[kill_chains.covert_op.phases.exploit.branches]]
condition = { type = "OnSuccess" }
next_phase = "exfil"

[kill_chains.covert_op.phases.exfil]
id = "exfil"
name = "Exfiltrate"
description = "Final step. One more detection opportunity / attribution roll."
base_success_probability = 0.80
min_duration = 2
max_duration = 5
detection_probability_per_tick = 0.16
prerequisite_success_boost = 0.0
attribution_difficulty = 0.45
targets_domains = ["SignalsIntelligence"]

[kill_chains.covert_op.phases.exfil.cost]
attacker_dollars = 1_500.0
defender_dollars = 8_000.0
attacker_resources = 1.0

