# Blue is Allied to gray (the alliance the misattribution will break)
# and Hostile to red.
[[factions.blue_defender.diplomacy]]
target_faction = "gray_partner"
stance = "Allied"

[[factions.blue_defender.diplomacy]]
target_faction = "red_attacker"
stance = "Hostile"

# Blue's alliance_fracture rule: flip the relationship with gray to
# Hostile when blue's mean attribution *against gray* crosses 0.3.
# Because believed-attribution credits attribution confidence to the
# BELIEVED faction, a run where blue misattributes red's chain to gray
# accumulates attribution against gray and trips this rule — the
# misattribution drives a behavioral break against an innocent ally.
[factions.blue_defender.alliance_fracture]
[[factions.blue_defender.alliance_fracture.rules]]
id = "blame_gray"
counterparty = "gray_partner"
new_stance = "Hostile"
description = "Blue (mis)attributes the covert operation to gray and severs the alliance."
[factions.blue_defender.alliance_fracture.rules.condition]
kind = "AttributionThreshold"
attacker = "gray_partner"
threshold = 0.3

[factions.gray_partner]
id = "gray_partner"
name = "Gray Partner — Innocent Ally"
description = "Innocent ally of blue. Did nothing — but red's false flag frames gray, and blue's low intelligence makes the frame stick."
