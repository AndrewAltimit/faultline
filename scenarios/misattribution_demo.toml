# Misattribution Demo — Epic M round-two archetype
#
# Demonstrates believed-attribution rolls
# (`simulation.belief_model.believed_attribution = true`) end-to-end: a
# defender that misattributes an attack ACTS on the misattribution and
# fractures from an innocent ally.
#
# Three factions:
#   - red_attacker: runs a covert kill chain against blue_defender.
#     This is the TRUE author of every detected phase.
#   - blue_defender: target of the chain. LOW intelligence (0.25), so
#     its detection-time attribution is barely better than a coin flip
#     before deception. Allied to gray_partner.
#   - gray_partner: an innocent ally of blue. Red runs a false-flag
#     deception that plants a `Deceived` region-control belief in
#     blue's mind naming gray as the controller of red's home region —
#     pointing blue's attribution finger at gray.
#
# With believed-attribution on, when blue detects a phase of red's
# chain it draws a believed attacker from a distribution weighted by
# its (low) intelligence and biased by the planted false flag toward
# gray. Blue therefore frequently misattributes red's attack to gray.
# blue's alliance_fracture rule fires against gray on
# `AttributionThreshold { attacker = "gray_partner" }` — so the
# misattribution breaks the blue–gray alliance even though gray did
# nothing. The fracture accounting credits the attribution confidence
# to the BELIEVED faction (gray), not the true one (red).
#
# The report's `## Attribution Fidelity` section quantifies the
# misattribution rate, how much of it the false flag drove, and how
# many runs the misattribution went on to drive an alliance fracture.
#
# Determinism: the believed-attribution draw consumes exactly one
# engine-RNG value per detection, gated entirely behind the sub-flag,
# so a copy of this scenario with the flag off would consume RNG in
# the legacy order and be bit-identical to a pre-Epic-M-round-two run.
#
# All parameters are aggregate statistical descriptors. The scenario
# is descriptive, not prescriptive, and contains no classified, CUI,
# or export-controlled information.
#
# Run with:
#   cargo run -p faultline-cli -- scenarios/misattribution_demo.toml -n 100

[meta]
schema_version = 1
name = "Misattribution Demo — Believed-Attribution Drives a False Fracture"
description = "Three-faction archetype showing a low-intelligence, deceived defender misattributing an attack to an innocent ally and fracturing the alliance against it. Surfaces the misattribution rate, deception-driven rate, and fracture-misattribution count in the report's Attribution Fidelity section."
author = "AI Agent Bot"
version = "0.1.0"
tags = ["belief", "deception", "false-flag", "attribution", "misattribution", "alliance-fracture", "epic-m", "round-two"]
scenario_type = "demo"
analytical_purpose = "Show believed-attribution driving a false alliance fracture: a low-intelligence, deceived defender misattributes an attack to an innocent ally and fractures the alliance against it."
red_team_profile = "Attacker exploiting deception so the defender misattributes the attack to an innocent third party."
blue_team_posture = "Low-intelligence defender that acts on its (incorrect) believed attribution and fractures against an innocent ally."
sensitivity_parameters = [
    "defender intelligence stat (misattribution likelihood)",
    "believed-attribution / fracture thresholds",
]

