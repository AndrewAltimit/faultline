cost_per_tick = 0.15
deployment_cost = 25.0
coverage_limit = 2
countered_by = ["sigint_emcon_discipline"]
terrain_modifiers = []

[[technology.comms_metadata_geolocation.effects]]
type = "IntelGain"
probability = 0.4

[[technology.comms_metadata_geolocation.effects]]
type = "MoraleEffect"
