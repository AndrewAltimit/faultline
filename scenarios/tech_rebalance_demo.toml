# Tech Library Rebalance Demo (Epic F — tech capability-card rebalance)
# =====================================================================
#
# The bundled tech library has historically been weighted toward drone /
# counter-drone and institutional-erosion cards, with very few cards in
# five high-relevance categories: SIGINT, supply-chain weaponization,
# SCADA/ICS, GPS/PNT denial, and deepfakes / synthetic media. This
# scenario introduces a balanced set of NEW capability cards across
# exactly those categories and gives a red threat actor and a blue
# defender access to them so the cards' interactions can be exercised.
#
# As with every tech card in Faultline, each card is a named bundle of
# AGGREGATE STATISTICAL EFFECTS derived from PUBLIC specifications
# (effect-level: "detection range vs. RCS"-style figures), NOT
# implementation detail. All parameters are sourceable from public OSINT
# (IISS Military Balance, CRS/GAO reports, NIST / standards publications,
# congressional testimony, and published defensive-community analyses).
# No classified, CUI, or export-controlled information is encoded.
#
# Card vocabulary additions are documented in
# `docs/scenario_schema.md` (the "Bundled capability-card categories"
# subsection under `[technology.<tech_id>]`).

[meta]
schema_version = 1
name = "Tech Library Rebalance Demo"
description = """
Two-faction sandbox wired with a balanced set of new capability cards
spanning the five previously under-represented categories: SIGINT,
supply-chain weaponization, SCADA/ICS, GPS/PNT denial, and deepfakes /
synthetic media. Use it to probe how these offensive capabilities
interact with their defensive counters. Every card is an aggregate
statistical effect derived from public specifications only.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["demo", "tech-cards", "sigint", "supply-chain", "scada-ics", "gps-denial", "deepfakes"]
confidence = "Medium"

