# -- Technology -------------------------------------------------------------
# All effects are aggregate statistical effects derived from PUBLIC
# specifications. Each card cites the category of OSINT it is sourced
# from. No implementation detail is encoded.

[technology]

# --- SIGINT (signals intelligence) ----------------------------------------

[technology.passive_sigint_collection]
id = "passive_sigint_collection"
name = "Passive SIGINT Collection Array"
description = "Wide-band passive RF collection against emitters of interest. Effect-level model of a passive intercept posture (detection range scales with emitter power and antenna aperture per published RF-propagation fundamentals). Sourced from open SIGINT literature and published sensor specs; no waveform or processing detail."
category = { Custom = "SIGINT" }
cost_per_tick = 0.2
deployment_cost = 40.0
coverage_limit = 2
countered_by = ["sigint_emcon_discipline"]
terrain_modifiers = [
  { terrain = "Urban", effectiveness = 0.7 },
  { terrain = "Mountain", effectiveness = 0.5 },
]

[[technology.passive_sigint_collection.effects]]
type = "IntelGain"
probability = 0.45

[[technology.passive_sigint_collection.effects]]
type = "DetectionModifier"
factor = 0.1

[technology.comms_metadata_geolocation]
id = "comms_metadata_geolocation"
name = "Comms Metadata Geolocation"
description = "Traffic-analysis and emitter-geolocation against communications metadata. Effect-level model of a metadata-exploitation cell building target patterns-of-life from collection. Sourced from open traffic-analysis literature; no collection-platform or algorithm detail."
