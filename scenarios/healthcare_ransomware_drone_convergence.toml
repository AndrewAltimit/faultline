# Healthcare Ransomware + Drone Convergence — Flagship Scenario
# =============================================================
#
# A regional health-system crisis in which a financially-motivated
# intrusion set converges two attack vectors against a metropolitan
# hospital network and its supporting critical infrastructure:
#
#   1. A hospital-network RANSOMWARE campaign (clinical-system
#      availability loss, EHR downtime, emergency-services diversion).
#   2. A DRONE-delivered wireless-relay footprint that bridges an
#      air-gapped clinical/OT boundary, accelerating and re-enabling the
#      cyber campaign even after the defender begins network isolation.
#
# Analytical purpose: quantify how the convergence of a physical
# (drone-relay) vector with a cyber (ransomware) vector compresses the
# defender's available response window relative to either vector alone,
# and how far accumulated disruption pressure climbs before the
# health-system's continuity-of-care posture fails.
#
# Modeling approach: the decisive outcome is driven by a multi-phase
# KILL CHAIN whose terminal phases accumulate CoercionPressure (the
# engine's generic non-kinetic disruption metric) past a
# NonKineticThreshold victory condition — the reliable path to a
# decisive verdict in this engine. The new healthcare /
# critical-infrastructure capability cards are referenced via faction
# tech_access so the attack/defense pairing is visible in the report.
#
# OSINT provenance (aggregate statistical effects only — no payload,
# exploit, or implementation detail):
#   - CISA / HHS HC3 public advisories on hospital ransomware and IoMT
#     exposure; published 2-4 week hospital-outage durations.
#   - GAO / CRS reporting on healthcare and critical-infrastructure
#     cybersecurity.
#   - RAND / IISS open analyses of small-UAS adversary capability and
#     wireless-relay risk.
#   - Open incident reporting on 911 / EMS disruption during ransomware
#     events.
# No classified, CUI, or export-controlled material is used.

# Budget caps — top-level fields before the first section header.
attacker_budget = 400_000.0
defender_budget = 80_000_000.0

[meta]
schema_version = 1
name = "Healthcare Ransomware + Drone Convergence"
description = """
Regional health-system crisis: a financially-motivated intrusion set
converges a hospital-network ransomware campaign with a drone-delivered
wireless-relay footprint that bridges the clinical/OT boundary. Models
how the convergence of a physical and a cyber vector compresses the
defender's response window and drives accumulated disruption pressure
past the health-system's continuity-of-care resilience threshold.

Parameters are aggregate statistical effects drawn from public CISA /
HHS, GAO / CRS, and RAND / IISS analyses. No payload, exploit, or
implementation detail is encoded.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["healthcare", "critical-infrastructure", "ransomware", "drone", "kill-chain", "convergence"]
scenario_type = "red_team"
analytical_purpose = "Quantify how converging a drone-delivered wireless-relay vector with a hospital-network ransomware campaign compresses the defender's response window and drives accumulated disruption pressure past a regional health-system's continuity-of-care resilience threshold."
red_team_profile = "Financially-motivated intrusion set running a two-vector convergence: hospital-network ransomware (clinical-system availability loss, EHR downtime, emergency-services diversion) plus a drone-delivered wireless relay that re-bridges the clinical/OT boundary after the defender begins isolation."
blue_team_posture = "Metropolitan health system with a security operations capability, clinical-downtime procedures, and counter-UAS gaps typical of a civilian medical campus; isolation and continuity controls are the contested variables."
osint_sources = [
    "CISA / HHS HC3 public advisories on hospital ransomware and IoMT exposure",
    "Published 2-4 week hospital-outage durations from open incident reporting",
    "GAO / CRS reporting on healthcare and critical-infrastructure cybersecurity",
    "RAND / IISS open analyses of small-UAS adversary capability and wireless-relay risk",
    "Open incident reporting on 911 / EMS disruption during ransomware events",
]
sensitivity_parameters = [
    "drone-relay re-bridging phase success probability",
    "ransomware-propagation detection probability per tick",
    "defender continuity-control coverage",
]

