# -- Kill chain: escalating availability campaign --------------------------
#
# Four phases, each 1-3 ticks (one tick = one day), each emitting
# CoercionPressure (a generic availability-disruption metric here) on
# success. Cumulative pressure crosses the 0.55 disruption threshold
# around the second week — within the documented ~three-week window. High
# base success probabilities reflect the limited initial scrubbing
# capacity; the phased structure encodes the escalation from crude floods
# to coordinated botnet-driven waves and the eventual mitigation-led
# recovery.

[kill_chains.flood_op]
id = "flood_op"
name = "Escalating Nation-Scale Availability Campaign"
description = "Aggregate model of the multi-wave availability campaign: initial crude floods, coordinated botnet-driven waves, sustained saturation of public services, and the window before mitigation restores availability."
attacker = "flood_operator"
target = "national_services"
entry_phase = "initial_floods"

[kill_chains.flood_op.phases.initial_floods]
id = "initial_floods"
name = "Initial Crude Floods"
description = "Aggregate model of the opening, easily-traced flood waves probing the target's externally-facing services. Effect-level only; no tooling detail."
prerequisites = []
base_success_probability = 0.95
min_duration = 2
max_duration = 3
detection_probability_per_tick = 0.01
attribution_difficulty = 0.4
targets_domains = ["NetworkSecurity"]

[[kill_chains.flood_op.phases.initial_floods.outputs]]
type = "CoercionPressure"
delta = 0.16

[[kill_chains.flood_op.phases.initial_floods.branches]]
condition = { type = "OnSuccess" }
next_phase = "coordinated_waves"

[kill_chains.flood_op.phases.coordinated_waves]
id = "coordinated_waves"
name = "Coordinated Botnet-Driven Waves"
description = "Aggregate model of escalation to coordinated, distributed botnet-driven traffic waves that scale beyond the target's initial filtering capacity."
prerequisites = ["initial_floods"]
base_success_probability = 0.94
min_duration = 2
max_duration = 3
detection_probability_per_tick = 0.01
prerequisite_success_boost = 0.05
attribution_difficulty = 0.5
targets_domains = ["NetworkSecurity"]

[[kill_chains.flood_op.phases.coordinated_waves.outputs]]
type = "CoercionPressure"
delta = 0.18

[[kill_chains.flood_op.phases.coordinated_waves.branches]]
condition = { type = "OnSuccess" }
next_phase = "sustained_saturation"

[kill_chains.flood_op.phases.sustained_saturation]
id = "sustained_saturation"
name = "Sustained Saturation of Public Services"
description = "Aggregate model of sustained saturation rendering government, banking, and media services intermittently unreachable across the estate."
prerequisites = ["coordinated_waves"]
base_success_probability = 0.93
min_duration = 2
max_duration = 3
detection_probability_per_tick = 0.01
prerequisite_success_boost = 0.05
attribution_difficulty = 0.5
targets_domains = ["NetworkSecurity"]

[[kill_chains.flood_op.phases.sustained_saturation.outputs]]
type = "CoercionPressure"
delta = 0.18

[[kill_chains.flood_op.phases.sustained_saturation.outputs]]
type = "InfraDamage"
region = "service_estate"
factor = 0.5

[[kill_chains.flood_op.phases.sustained_saturation.branches]]
condition = { type = "OnSuccess" }
next_phase = "peak_disruption"

[kill_chains.flood_op.phases.peak_disruption]
id = "peak_disruption"
name = "Peak Disruption Before Mitigation"
description = "Terminal phase. Aggregate model of the peak-disruption window before upstream filtering, traffic scrubbing, and cooperation restore availability."
prerequisites = ["sustained_saturation"]
base_success_probability = 0.92
min_duration = 2
max_duration = 3
detection_probability_per_tick = 0.01
prerequisite_success_boost = 0.05
attribution_difficulty = 0.5
targets_domains = ["NetworkSecurity"]

[[kill_chains.flood_op.phases.peak_disruption.outputs]]
type = "CoercionPressure"
delta = 0.15

# -- Simulation Config ------------------------------------------------------
#
# 35-day cap brackets the documented ~three-week multi-wave campaign with
# headroom. One tick = one day. The attacker wins by crossing the
# availability-disruption (CoercionPressure) threshold; the defender wins
# only by keeping its public-service estate available for the full
# horizon.

[simulation]
max_ticks = 35
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 2007
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Days = 1

