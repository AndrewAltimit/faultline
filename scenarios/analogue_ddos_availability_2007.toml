# Historical-analogue scenario
# =============================
#
# Single named-event analogue: the spring 2007 distributed
# denial-of-service (DDoS) availability campaign against a single small,
# highly-networked nation's online public services — government portals,
# banking, news media, and telecommunications-facing services. It is the
# canonical early public example of a sustained, nation-scale
# availability campaign, and its outline is well documented in OPEN
# defensive-community and academic sources, which makes it a clean
# single-event calibration analogue for a denial-of-service / availability
# episode (as distinct from a destructive or intrusion event).
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("flood_operator"): a distributed availability-attack
#   operation that marshaled large volumes of traffic — escalating from
#   crude, easily-traced floods to coordinated botnet-driven waves — to
#   saturate the target nation's externally-facing public services over
#   a multi-week window timed to a political dispute.
# Defender ("national_services"): a small nation's online public-service
#   estate (government, banking, media, telecom-facing services) with
#   limited upstream filtering and scrubbing capacity at the outset, which
#   degraded under load before mitigation (filtering, traffic scrubbing,
#   upstream cooperation) eventually restored availability.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# attack tooling detail, no botnet internals, no implementation specifics)
# ---------------------------------------------------------------------
# - Campaign shape (initial crude floods → coordinated botnet-driven
#   waves → sustained saturation of public services → gradual mitigation)
#   is drawn from public defensive-community incident analyses and
#   academic case studies of the 2007 events. Only the AGGREGATE phase
#   structure and public outcome are encoded — no attack-tool or botnet
#   internals.
# - Outcome: a successful availability campaign — the target's public
#   services were intermittently unreachable for a sustained period
#   before mitigation restored them. Encoded as high phase-success
#   probabilities and an attacker win on the availability-impact metric.
# - Duration: the campaign unfolded over roughly three weeks (late April
#   to mid-May 2007), in escalating waves, per the public timeline.
#   Modeled at one tick = one day over a multi-week horizon; the duration
#   band brackets the documented ~three-week window with two-sided
#   uncertainty.
#
# All figures (~three-week multi-wave availability campaign against a
# single nation's public services, mitigation-led recovery) are from
# public reporting and contain no classified, CUI, or export-controlled
# material.

[meta]
schema_version = 1
name = "Analogue — Nation-Scale DDoS Availability Campaign (Spring 2007)"
description = """
Single-event historical analogue: the spring 2007 distributed
denial-of-service availability campaign against a single small,
highly-networked nation's online public services. A distributed
availability operation escalated from crude floods to coordinated
botnet-driven waves, saturating government, banking, media, and
telecom-facing services intermittently over roughly three weeks before
mitigation restored availability — the canonical early public example of
a nation-scale availability campaign. The documented attacker-success
outcome and multi-week duration are encoded as calibration observations
and back-tested against the Monte Carlo distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public defensive-community incident analyses and
academic case studies. No attack-tooling detail, botnet internals,
classified, CUI, or export-controlled material is encoded — only the
aggregate statistical effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "ddos", "availability", "infrastructure"]
confidence = "Medium"

[meta.historical_analogue]
name = "Spring 2007 nation-scale DDoS availability campaign"
description = """
A multi-week distributed denial-of-service campaign (late April to
mid-May 2007) that intermittently saturated a small nation's online
public services — government, banking, media, telecom-facing services —
escalating from crude floods to coordinated botnet-driven waves before
mitigation restored availability. The analogue back-tests whether this
scenario's kill-chain parameters reproduce both the documented victor
(the attacker, on the availability-impact metric) and the documented
multi-week duration.
"""
period = "2007-04-27 to 2007-05-18"
sources = [
    "Public defensive-community incident analyses of the spring 2007 DDoS events",
    "Academic case-study literature on the 2007 nation-scale availability campaign",
    "Congressional Research Service reporting on denial-of-service threats to networked services",
    "Published open analyses of botnet-driven availability attacks",
]
confidence = "Medium"

# Documented victor: the availability campaign succeeded in disrupting
# public services for a sustained period.
[[meta.historical_analogue.observations]]
notes = "Public incident analyses: the campaign intermittently rendered the target's public services unreachable for a sustained period before mitigation."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "flood_operator"

# Win-rate band: a sustained multi-wave availability campaign against a
# small estate with limited initial scrubbing capacity achieves
# meaningful disruption at a high rate. Band kept wide for single-case
# uncertainty.
[[meta.historical_analogue.observations]]
notes = "A sustained multi-wave availability campaign against limited initial scrubbing capacity achieves meaningful disruption at a high rate; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "flood_operator"
low = 0.70
high = 1.0

# Duration: ~three weeks (late April to mid-May 2007) at one tick = one
# day. Interval [7, 28] brackets the documented multi-week window with
# two-sided uncertainty.
[[meta.historical_analogue.observations]]
notes = "Campaign unfolded over ~three weeks in escalating waves (late April to mid-May 2007); modeled at one tick = one day. Band brackets the window on both sides."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 7
high = 28

