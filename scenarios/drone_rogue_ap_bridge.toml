# Drone-Delivered Rogue-AP Network Bridge — Defensive Planning Wargame
# =====================================================================
#
# Cyber-physical convergence archetype. A drone emplaces a battery- or
# solar-powered rogue wireless access point (Wi-Fi / cellular relay) on
# or adjacent to a target facility, bridging an over-the-air foothold
# into a segmented operational-technology (OT) network that the operator
# assumed was isolated from the internet. The campaign is a multi-phase
# kill chain that crosses the seam between counter-UAS (the airborne
# delivery vehicle), physical security (the emplaced device), wireless /
# RF monitoring (the rogue beacon), and network / OT security (the
# segmentation the bridge defeats).
#
# Analytical purpose: quantify the defender's detection window and
# cost-asymmetry against an adversary that uses an aerial delivery vehicle
# to defeat physical access controls and an over-the-air bridge to defeat
# network segmentation — i.e., the doctrinal gap that opens when a SOC
# watches the wired network, a physical-security team watches the
# perimeter, a C-UAS team watches the airspace, and an RF cell watches the
# spectrum, but no single owner watches the *convergence* of all four.
#
# Modeling approach: a six-phase kill chain (airspace ingress -> device
# emplacement -> rogue-AP beacon -> segmentation bridge -> OT enumeration
# -> manipulation/exfiltration). The defender is modeled with a bounded
# investigative queue (a tier-1 SOC cell) that a noisy enumeration phase
# floods, so a later quiet phase rolls its detection against a saturated
# queue — the alert-fatigue mechanism. Analytical outputs are the
# feasibility matrix, cost-asymmetry ratio, detection rate, attribution
# confidence, and cross-domain seam exploitation surfaced in the report.
#
# OSINT provenance (aggregate statistical effects only — describe effects,
# not implementations; no exploit, configuration, or tradecraft detail):
#   - CISA public advisories on UAS threats and ICS/OT security, and the
#     guidance on rogue/unauthorized wireless devices on enterprise and
#     OT networks.
#   - NIST SP 800-82 (Guide to ICS Security) and NIST guidance on network
#     segmentation and wireless security, at the control-effect level.
#   - GAO reporting on C-UAS coordination gaps and critical-infrastructure
#     cybersecurity.
#   - RAND public research on small-UAS adversary capabilities.
#   - Published SOC-economics surveys (alert volumes, triage throughput,
#     median dwell time) used to size the defender investigative queue.
#   - Open security-research literature on rogue access points, wireless
#     bridging, and air-gap / segmentation assumptions.
# No classified, CUI, or export-controlled material is used. This is a
# defensive-planning wargame, not an operational playbook.

# Budget caps. The full chain's maximum attacker spend is well under the
# cap; the cap is non-binding and present for completeness. The defender
# cap is sized so a successful late-phase OT manipulation can push the
# defender past it, exercising the over-budget detection penalty.
attacker_budget = 200_000.0
defender_budget = 60_000_000.0

