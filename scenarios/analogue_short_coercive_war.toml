# -- Kill chain: rapid coercive campaign -----------------------------------
#
# Three short phases, each 1-2 ticks, each emitting CoercionPressure on
# success. Cumulative pressure crosses the 0.55 ceasefire threshold
# around tick 4-6 — the several-day active phase. High base success
# probabilities encode the aggressor's overmatch (a coercive campaign at
# this force asymmetry rarely stalls).

[kill_chains.coercion]
id = "coercion"
name = "Rapid Coercive Intervention"
description = "Aggregate model of a multi-axis coercive campaign (ground advance, air operations, accompanying pressure effort) compelling the smaller state to accept a ceasefire."
attacker = "northern_power"
target = "southern_state"
entry_phase = "border_operations"

[kill_chains.coercion.phases.border_operations]
id = "border_operations"
name = "Cross-Border Operations"
description = "Opening multi-axis operations establishing the aggressor's freedom of action over the disputed enclave."
prerequisites = []
base_success_probability = 0.92
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.0
attribution_difficulty = 0.2
targets_domains = ["PhysicalSecurity"]

[[kill_chains.coercion.phases.border_operations.outputs]]
type = "CoercionPressure"
delta = 0.22

[[kill_chains.coercion.phases.border_operations.outputs]]
type = "TensionDelta"
delta = 0.1

[[kill_chains.coercion.phases.border_operations.branches]]
condition = { type = "OnSuccess" }
next_phase = "deep_operations"

[kill_chains.coercion.phases.deep_operations]
id = "deep_operations"
name = "Deep Operations & Air Pressure"
description = "Aggregate model of follow-on operations and air pressure against the defender's interior approaches, raising the political cost of continued resistance."
prerequisites = ["border_operations"]
base_success_probability = 0.9
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.2
targets_domains = ["PhysicalSecurity"]

[[kill_chains.coercion.phases.deep_operations.outputs]]
type = "CoercionPressure"
delta = 0.22

[[kill_chains.coercion.phases.deep_operations.outputs]]
type = "MoraleDelta"
faction = "southern_state"
delta = -0.15

[[kill_chains.coercion.phases.deep_operations.branches]]
condition = { type = "OnSuccess" }
next_phase = "compel_ceasefire"

[kill_chains.coercion.phases.compel_ceasefire]
id = "compel_ceasefire"
name = "Compel Ceasefire"
description = "Terminal phase. Aggregate model of the coercive pressure compelling the smaller state to accept a ceasefire on the aggressor's terms."
prerequisites = ["deep_operations"]
base_success_probability = 0.9
min_duration = 1
max_duration = 2
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.2
targets_domains = ["ExecutiveProtection"]

[[kill_chains.coercion.phases.compel_ceasefire.outputs]]
type = "CoercionPressure"
delta = 0.25

# -- Simulation Config ------------------------------------------------------
#
# 14-day cap brackets the documented ~5-day active phase with headroom.
# The aggressor wins by crossing the ceasefire (CoercionPressure)
# threshold; the defender wins only by surviving the full horizon with
# its political resilience intact.

[simulation]
max_ticks = 14
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 2008
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Days = 1

# -- Victory Conditions -----------------------------------------------------

# Aggressor objective: coerce a ceasefire (cumulative CoercionPressure
# crosses the defender's political-resilience threshold).
[victory_conditions.coerced_ceasefire]
id = "coerced_ceasefire"
name = "Northern Power Coerces Ceasefire"
faction = "northern_power"

[victory_conditions.coerced_ceasefire.condition]
type = "NonKineticThreshold"
metric = "CoercionPressure"
threshold = 0.55

# Defender objective: hold the interior for the full horizon without
# being coerced into a settlement.
[victory_conditions.southern_survival]
id = "southern_survival"
name = "Southern State Resists Coercion"
faction = "southern_state"

[victory_conditions.southern_survival.condition]
type = "HoldRegions"
regions = ["southern_capital"]
duration = 14
