# Historical-analogue scenario (Epic N round-two)
# =================================================
#
# Single named-event analogue: the August 2008 Russo-Georgian War,
# modeled as a rapid coercive military campaign whose documented end
# state was a coerced ceasefire within roughly five days. Distinct from
# `calibration_demo.toml`'s stylized-aggregate analogue.
#
# ---------------------------------------------------------------------
# Modeling choice (read this first)
# ---------------------------------------------------------------------
# Faultline's combat model resolves attrition where opposing forces
# co-locate; it does not model a force seizing and holding a defended
# interior. A short inter-state war whose decisive feature was the rapid
# coercion of the smaller state into a ceasefire is therefore modeled at
# the level of COERCIVE PRESSURE rather than territorial annihilation:
# the aggressor runs a short campaign whose successful phases accumulate
# the engine's generic `CoercionPressure` metric, and the run resolves
# when that pressure crosses a defender political-resilience threshold —
# i.e. the point at which the smaller state accepts a ceasefire. This is
# the engine's reliable, well-instrumented subsystem (kill chains +
# non-kinetic accumulators) and is the analytically honest way to encode
# "the stronger side coerced a settlement in days."
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Aggressor ("northern_power"): a large conventional combined-arms power
#   conducting a rapid multi-axis intervention (ground advance, air
#   operations, and an accompanying information/coercion effort) against
#   a much smaller neighbor over a contested enclave.
# Defender ("southern_state"): a small, recently-reformed conventional
#   army with limited strategic depth, defending home territory.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# order-of-battle reconstruction, no classified or CUI material)
# ---------------------------------------------------------------------
# - Force asymmetry: open-source post-conflict analyses (IISS Military
#   Balance; RAND post-conflict assessments) place the aggressor's
#   committed power roughly an order of magnitude above the defender's
#   fielded force in-theatre. Encoded as a high base success probability
#   on the campaign's pressure phases (an overmatched coercive campaign
#   rarely stalls), not as a literal strength ratio.
# - Duration: the active high-intensity phase lasted ~5 days
#   (2008-08-07/08 to the ~2008-08-12 ceasefire) per the widely-reported
#   public timeline and the 2009 EU fact-finding mission report.
# - Outcome: the stronger side achieved its operational objectives and
#   the smaller state accepted a ceasefire — a decisive aggressor result.
#
# ---------------------------------------------------------------------
# Calibration claim
# ---------------------------------------------------------------------
# The aggressor prevails (coerces a settlement), at a high win rate,
# within days. Back-tested in the report's `## Calibration` section.

[meta]
schema_version = 1
name = "Analogue — Short Coercive Inter-State War (Aug 2008)"
description = """
Single-event historical analogue: the August 2008 Russo-Georgian War,
modeled as a rapid coercive military campaign. A large conventional
power coerces a much smaller neighbor into a ceasefire within roughly
five days. The documented outcome — decisive aggressor success in days —
is encoded as calibration observations and back-tested against the Monte
Carlo distribution. The coercion is modeled via the engine's non-kinetic
`CoercionPressure` accumulator (its reliable kill-chain subsystem)
rather than territorial annihilation; see the header comment for the
rationale.

Parameters are aggregate phase success / duration / pressure values
sourced from public OSINT (IISS Military Balance, RAND post-conflict
analyses, the 2009 EU Independent International Fact-Finding Mission
report, academic conflict-outcome literature). No order-of-battle
reconstruction, classified, CUI, or export-controlled material is
encoded — only the aggregate statistical effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "asymmetric", "inter-state", "coercion", "short-war"]
confidence = "Medium"

[meta.historical_analogue]
name = "August 2008 Russo-Georgian War — coerced ceasefire"
description = """
The five-day active phase ending in a coerced ceasefire (~2008-08-12). A
large conventional power coerced a much smaller defender into a
settlement within days. The analogue back-tests whether this scenario's
coercion-campaign parameters reproduce both the documented victor (the
aggressor) and the documented short duration.
"""
period = "2008-08-07 to 2008-08-12"
sources = [
    "IISS Military Balance (annual editions covering 2008-2009)",
    "RAND post-conflict assessments of the 2008 conflict",
    "EU Independent International Fact-Finding Mission on the Conflict in Georgia (2009 report) — public timeline",
    "Academic conflict-outcome literature on short asymmetric inter-state wars",
]
confidence = "Medium"

# Documented victor: the stronger conventional power coerced a ceasefire.
[[meta.historical_analogue.observations]]
notes = "Public post-conflict consensus: the aggressor achieved its operational objectives and the smaller state accepted a ceasefire within days."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "northern_power"

# Win-rate band: across comparable short asymmetric inter-state coercive
# campaigns with an order-of-magnitude committed-force advantage, the
# stronger side's success rate is very high. Band kept wide for
# single-case + reference-set uncertainty.
[[meta.historical_analogue.observations]]
notes = "Stronger-side success rate in comparable short asymmetric coercive campaigns is high; band kept wide for single-case uncertainty."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "northern_power"
low = 0.70
high = 1.0

# Duration: active phase ~5 days. Interval [2, 9] brackets the documented
# figure with uncertainty on both sides.
[[meta.historical_analogue.observations]]
notes = "Active high-intensity phase lasted ~5 days (2008-08-07/08 to ~2008-08-12 ceasefire) per the public timeline."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 2
high = 9

