# Supply-Chain Weaponization — Flagship Scenario
# ==============================================
#
# A trusted-update supply-chain compromise weaponized against downstream
# critical-infrastructure operators. A state-aligned intrusion set
# compromises a widely-deployed industrial / clinical software vendor's
# update channel, then selectively activates a payload against
# high-value downstream targets (a regional hospital network and a
# water utility) once the trojanized update has propagated.
#
# The scenario contrasts two things a defender cares about:
#   1. The PROPAGATION window — how long the trojanized update sits
#      undetected across the downstream estate before activation.
#   2. The downstream IMPACT — how far selective activation against
#      critical-infrastructure operators drives accumulated disruption
#      pressure once triggered.
#
# Analytical purpose: quantify the trade the attacker makes between a
# broad, low-detection propagation phase and a narrow, high-impact
# activation phase, and how far downstream disruption pressure climbs
# before the critical-infrastructure operators' resilience posture
# (SBOM / vendor monitoring, segmentation, continuity) fails.
#
# Modeling approach: the decisive outcome is driven by a multi-phase
# KILL CHAIN accumulating CoercionPressure past a NonKineticThreshold
# victory condition — the reliable path to a decisive verdict. The
# healthcare / critical-infrastructure cards are reused for the
# downstream-activation vectors.
#
# OSINT provenance (aggregate statistical effects only — no malware
# internals, exploit detail, or implementation specifics):
#   - CRS / GAO reporting on software supply-chain security and SBOM.
#   - CISA public guidance on supply-chain risk and ICS security.
#   - Public incident reporting on trusted-update supply-chain
#     compromises (e.g. the 2020 SolarWinds and 2017 supply-chain wiper
#     cases) at the aggregate-outcome level.
#   - Published academic / defensive-community analyses of
#     self-propagating and selectively-activated payloads.
# No classified, CUI, or export-controlled material is used.

attacker_budget = 600_000.0
defender_budget = 90_000_000.0

[meta]
