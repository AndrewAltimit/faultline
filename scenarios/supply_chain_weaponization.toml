name = "Supply-Chain Weaponization"
description = """
Trusted-update supply-chain compromise weaponized against downstream
critical-infrastructure operators. A state-aligned intrusion set
compromises a widely-deployed industrial / clinical software vendor's
update channel, propagates a trojanized update across the downstream
estate, then selectively activates a payload against a regional hospital
network and a water utility. Models the attacker's trade between a broad
low-detection propagation phase and a narrow high-impact activation
phase, and how far downstream disruption pressure climbs before the
operators' resilience posture fails.

Parameters are aggregate statistical effects drawn from public CRS / GAO,
CISA, and incident-reporting analyses. No malware internals, exploit
detail, or implementation specifics are encoded.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["supply-chain", "critical-infrastructure", "kill-chain", "propagation", "activation", "sbom"]
scenario_type = "red_team"
analytical_purpose = "Quantify the attacker's trade between a broad low-detection propagation phase and a narrow high-impact activation phase in a trusted-update supply-chain compromise, and how far downstream disruption pressure climbs before the critical-infrastructure operators' resilience posture fails."
red_team_profile = "State-aligned intrusion set that compromises a widely-deployed industrial / clinical software vendor's update channel, propagates a trojanized update across the downstream estate, then selectively activates a payload against a regional hospital network and a water utility."
blue_team_posture = "Downstream critical-infrastructure operators (hospital network, water utility) and the software vendor, defending with SBOM / vendor monitoring, network segmentation, OT monitoring, and continuity controls — the contested resilience variables."
osint_sources = [
    "CRS / GAO reporting on software supply-chain security and SBOM",
    "CISA public guidance on supply-chain risk and ICS security",
    "Public incident reporting on trusted-update supply-chain compromises (2017 / 2020 cases) at the aggregate-outcome level",
    "Published academic / defensive-community analyses of self-propagating and selectively-activated payloads",
]
sensitivity_parameters = [
    "propagation-phase detection probability per tick",
    "selective-activation phase success probability",
    "downstream operators' SBOM / segmentation coverage",
]

