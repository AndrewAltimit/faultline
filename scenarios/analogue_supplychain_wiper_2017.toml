# -- Kill chain: supply-chain implant to destructive propagation -----------
#
# Four short phases. Once the payload is released, self-propagation is
# near-certain and fast (high success, near-zero detection in the
# propagation window). Cumulative disruption pressure crosses the 0.55
# threshold within a few hours, reproducing the very short propagation.

[kill_chains.wiper_op]
id = "wiper_op"
name = "Supply-Chain Implant to Destructive Propagation"
description = "Aggregate model of the supply-chain implant, payload release, self-propagation, and destructive wipe across the enterprise estate."
attacker = "wiper_operator"
target = "enterprise_base"
entry_phase = "supplychain_implant"

[kill_chains.wiper_op.phases.supplychain_implant]
id = "supplychain_implant"
name = "Trojanize Update Channel"
description = "Aggregate model of compromising the software-update channel to seed the payload. Effect-level only; no implant or exploit detail."
prerequisites = []
base_success_probability = 0.95
min_duration = 1
max_duration = 1
detection_probability_per_tick = 0.02
attribution_difficulty = 0.85
targets_domains = ["SupplyChainSecurity"]

[[kill_chains.wiper_op.phases.supplychain_implant.outputs]]
type = "CoercionPressure"
delta = 0.15

[[kill_chains.wiper_op.phases.supplychain_implant.branches]]
condition = { type = "OnSuccess" }
next_phase = "payload_release"

[kill_chains.wiper_op.phases.payload_release]
id = "payload_release"
name = "Release Self-Propagating Payload"
description = "Aggregate model of releasing the payload through the trusted update, establishing initial footholds across the enterprise core."
prerequisites = ["supplychain_implant"]
base_success_probability = 0.95
min_duration = 1
max_duration = 1
detection_probability_per_tick = 0.01
prerequisite_success_boost = 0.05
attribution_difficulty = 0.85
targets_domains = ["SupplyChainSecurity", "NetworkSecurity"]

[[kill_chains.wiper_op.phases.payload_release.outputs]]
type = "CoercionPressure"
delta = 0.2

[[kill_chains.wiper_op.phases.payload_release.branches]]
condition = { type = "OnSuccess" }
next_phase = "self_propagation"

[kill_chains.wiper_op.phases.self_propagation]
id = "self_propagation"
name = "Automated Credential Harvest & Self-Propagation"
description = "Aggregate model of automated credential harvesting and lateral self-propagation across flat enterprise networks with shared administrative credentials."
prerequisites = ["payload_release"]
base_success_probability = 0.95
min_duration = 1
max_duration = 1
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.8
targets_domains = ["NetworkSecurity"]

[[kill_chains.wiper_op.phases.self_propagation.outputs]]
type = "CoercionPressure"
delta = 0.2

[[kill_chains.wiper_op.phases.self_propagation.branches]]
condition = { type = "OnSuccess" }
next_phase = "destructive_wipe"

[kill_chains.wiper_op.phases.destructive_wipe]
id = "destructive_wipe"
name = "Destructive Wipe"
description = "Terminal phase. Aggregate model of the destructive (disk-wiping) effect rendering systems inoperable across the global estate."
prerequisites = ["self_propagation"]
base_success_probability = 0.95
min_duration = 1
max_duration = 1
detection_probability_per_tick = 0.0
prerequisite_success_boost = 0.05
attribution_difficulty = 0.8
targets_domains = ["SupplyChainSecurity"]

[[kill_chains.wiper_op.phases.destructive_wipe.outputs]]
type = "CoercionPressure"
delta = 0.15

[[kill_chains.wiper_op.phases.destructive_wipe.outputs]]
type = "InfraDamage"
region = "global_estate"
factor = 0.9

# -- Simulation Config ------------------------------------------------------
#
# 12-hour cap brackets the very short propagation with headroom. One
# tick = one hour. The attacker wins by crossing the destructive-impact
# (CoercionPressure) threshold; the defender wins only by holding its
# global estate intact for the full horizon.

[simulation]
max_ticks = 12
monte_carlo_runs = 300
fog_of_war = false
snapshot_interval = 1
seed = 2017
attrition_model = "LanchesterLinear"

[simulation.tick_duration]
Hours = 1

