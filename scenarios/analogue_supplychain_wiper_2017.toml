# Historical-analogue scenario (Epic N round-two)
# =================================================
#
# Single named-event analogue: the June 2017 destructive
# supply-chain-delivered wiper event ("NotPetya"). A trojanized update
# to a widely-deployed accounting-software product seeded a
# self-propagating destructive payload that spread rapidly across
# enterprise networks worldwide, causing on the order of USD 10 billion
# in publicly-estimated damages. It is the canonical public example of
# supply-chain weaponization, which makes it an ideal single-event
# calibration analogue.
#
# ---------------------------------------------------------------------
# Threat-actor framing
# ---------------------------------------------------------------------
# Attacker ("wiper_operator"): a destructive intrusion set that
#   compromised the software-update channel of a widely-deployed
#   product, then released a self-propagating payload that combined
#   credential harvesting with network-spreading mechanisms and a
#   destructive (disk-wiping) effect masquerading as ransomware.
# Defender ("enterprise_base"): the global population of organizations
#   running the trojanized product, with flat internal networks and
#   shared administrative credentials enabling rapid lateral spread.
#
# ---------------------------------------------------------------------
# OSINT-sourced parameters (aggregate statistical effects only — no
# malware internals, no exploit detail, no implementation specifics)
# ---------------------------------------------------------------------
# - Kill-chain shape (supply-chain implant via the update channel →
#   automated credential harvest → self-propagation → destructive wipe)
#   is drawn from public incident reporting and defensive-community
#   analyses. Only the AGGREGATE phase structure and public outcome are
#   encoded — no malware internals or exploit detail.
# - Outcome: attacker-success at the scale of disruption — global,
#   rapid, with ~USD 10 billion in publicly-estimated damages across
#   multinational firms. Encoded as high phase-success probabilities, a
#   very short propagation time, and an attacker win.
# - Duration: the destructive propagation unfolded over hours once the
#   payload was released; here modeled at one tick = one hour over a
#   short horizon. Self-propagation = high success, low detection in the
#   propagation window.
#
# All figures (~USD 10B estimated damages, global rapid spread,
# supply-chain delivery) are from public reporting and contain no
# classified, CUI, or export-controlled material.

[meta]
schema_version = 1
name = "Analogue — Supply-Chain Destructive Wiper (Jun 2017)"
description = """
Single-event historical analogue: the June 2017 supply-chain-delivered
destructive wiper event. A trojanized software update seeded a
self-propagating destructive payload that spread rapidly across
enterprise networks worldwide, causing on the order of USD 10 billion in
publicly-estimated damages — the canonical public example of supply-chain
weaponization. The documented attacker-success outcome and very short
(hours) propagation are encoded as calibration observations and
back-tested against the Monte Carlo distribution.

Parameters are aggregate kill-chain phase success / duration / pressure
values drawn from public incident reporting and defensive-community
analyses. No malware internals, exploit detail, classified, CUI, or
export-controlled material is encoded — only the aggregate statistical
effects the engine consumes.
"""
author = "AI Agent Bot"
version = "1.0.0"
tags = ["analogue", "calibration", "cyber", "supply-chain", "wiper", "destructive"]
confidence = "High"

[meta.historical_analogue]
name = "June 2017 supply-chain destructive wiper"
description = """
A trojanized update to a widely-deployed product seeded a
self-propagating destructive payload that spread globally within hours,
causing ~USD 10 billion in publicly-estimated damages. The canonical
public supply-chain-weaponization case. The analogue back-tests whether
this scenario's kill-chain parameters reproduce both the documented
victor (the attacker) and the documented very short (hours) propagation.
"""
period = "2017-06-27"
sources = [
    "Public incident reporting on the June 2017 destructive supply-chain event",
    "Congressional Research Service / GAO reporting on software supply-chain security",
    "Published academic / defensive-community analyses of self-propagating destructive malware",
    "Public economic-impact estimates (~USD 10 billion) reported in open press and industry analyses",
]
confidence = "High"

# Documented victor: the attacker achieved global destructive disruption.
[[meta.historical_analogue.observations]]
notes = "Public reporting: the supply-chain-delivered payload propagated globally and destroyed data at multinational scale (~USD 10B estimated damages)."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "winner"
faction = "wiper_operator"

# Win-rate band: a self-propagating supply-chain payload against flat
# enterprise networks with shared credentials propagates with very high
# reliability once released. Band kept wide for single-case uncertainty.
[[meta.historical_analogue.observations]]
notes = "A self-propagating supply-chain payload against the documented enterprise posture propagates with very high reliability once released; band kept wide."
confidence = "Medium"
[meta.historical_analogue.observations.metric]
kind = "win_rate"
faction = "wiper_operator"
low = 0.80
high = 1.0

# Duration: destructive propagation unfolded over hours. One tick = one
# hour; interval [1, 7] brackets the very short propagation window.
[[meta.historical_analogue.observations]]
notes = "Destructive propagation unfolded over hours once the payload was released; modeled at one tick = one hour."
confidence = "High"
[meta.historical_analogue.observations.metric]
kind = "duration_ticks"
low = 1
high = 7

